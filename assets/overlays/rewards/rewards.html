<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>MiniKick Overlay</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: transparent;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        .media-layer {
            position: absolute;
        }
    </style>
</head>

<body>
    <div id="container"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token') || '';
        const container = document.getElementById('container');

        const alertQueue = [];
        let isPlaying = false;
        let ws = null;
        let reconnectTimer = null;
        let heartbeatTimer = null;

        function connectWS() {
            if (ws) {
                try { ws.close(); } catch (e) { }
                ws = null;
            }

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws?topic=rewards&token=${encodeURIComponent(token)}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = function () {
                console.log("[Rewards Overlay] WebSocket conectado exitosamente.");
                if (reconnectTimer) {
                    clearInterval(reconnectTimer);
                    reconnectTimer = null;
                }
                heartbeatTimer = setInterval(() => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'ping' }));
                    }
                }, 15000);
            };

            ws.onmessage = function (event) {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'pong') return;
                    alertQueue.push(data);
                    processQueue();
                } catch (e) {
                    console.error("Error parseando evento WebSocket:", e);
                }
            };

            ws.onerror = function (err) {
                console.warn("[Rewards Overlay] Error en WebSocket. Reintentando...");
                cleanup();
                scheduleReconnect();
            };

            ws.onclose = function () {
                console.warn("[Rewards Overlay] WebSocket cerrado. Reintentando...");
                cleanup();
                scheduleReconnect();
            };
        }

        function cleanup() {
            if (heartbeatTimer) {
                clearInterval(heartbeatTimer);
                heartbeatTimer = null;
            }
        }

        function scheduleReconnect() {
            if (!reconnectTimer) {
                reconnectTimer = setInterval(() => {
                    console.log("[Rewards Overlay] Intentando reconectar WebSocket...");
                    connectWS();
                }, 3000);
            }
        }

        connectWS();

        function processQueue() {
            if (isPlaying || alertQueue.length === 0) {
                return;
            }

            isPlaying = true;
            const currentAlert = alertQueue.shift();
            playAlert(currentAlert);
        }

        function isImageFile(ext) {
            return ['.png', '.jpg', '.jpeg', '.gif', '.webp', '.svg', '.bmp', '.avif'].includes(ext);
        }

        function isAudioFile(ext) {
            return ['.mp3', '.wav', '.ogg', '.aac', '.flac', '.m4a', '.wma'].includes(ext);
        }

        function playAlert(data) {
            const ext = (data.file_ext || '').toLowerCase();
            let mediaEl;
            let timerId = null;

            const onMediaFinished = () => {
                if (timerId) {
                    clearTimeout(timerId);
                    timerId = null;
                }
                if (mediaEl && mediaEl.parentNode) {
                    mediaEl.remove();
                }
                isPlaying = false;
                processQueue();
            };

            if (isImageFile(ext)) {
                mediaEl = document.createElement('img');
                mediaEl.src = data.file_url;
                mediaEl.className = 'media-layer';

                const displaySeconds = data.duration || 5.0;
                mediaEl.onload = () => {
                    timerId = setTimeout(onMediaFinished, displaySeconds * 1000);
                };
                mediaEl.onerror = (e) => {
                    console.error("[Rewards Overlay] Error cargando imagen:", e);
                    onMediaFinished();
                };
            } else if (isAudioFile(ext)) {
                mediaEl = document.createElement('audio');
                mediaEl.src = data.file_url;
                mediaEl.volume = data.volume !== undefined ? data.volume : 1.0;
                mediaEl.onended = onMediaFinished;
                mediaEl.onerror = (e) => {
                    console.error("[Rewards Overlay] Error reproduciendo audio:", e);
                    onMediaFinished();
                };
                mediaEl.play().catch(e => {
                    console.warn("[Rewards Overlay] Autoplay de audio bloqueado:", e);
                    onMediaFinished();
                });
            } else {
                mediaEl = document.createElement('video');
                mediaEl.src = data.file_url;
                mediaEl.className = 'media-layer';
                mediaEl.autoplay = true;
                mediaEl.volume = data.volume !== undefined ? data.volume : 1.0;
                mediaEl.onended = onMediaFinished;
                mediaEl.onerror = (e) => {
                    console.error("[Rewards Overlay] Error reproduciendo video:", e);
                    onMediaFinished();
                };
                mediaEl.play().catch(e => {
                    console.warn("[Rewards Overlay] Autoplay de video bloqueado:", e);
                });
            }

            if (mediaEl.tagName !== 'AUDIO') {
                const scale = data.scale || 1.0;
                mediaEl.style.transform = `scale(${scale})`;
                mediaEl.style.transformOrigin = "top left";

                if (data.is_random_pos) {
                    const randX = Math.floor(Math.random() * 75);
                    const randY = Math.floor(Math.random() * 75);
                    mediaEl.style.left = randX + "%";
                    mediaEl.style.top = randY + "%";
                } else {
                    const px = data.pos_x || 0;
                    const py = data.pos_y || 0;
                    mediaEl.style.left = px + "px";
                    mediaEl.style.top = py + "px";
                }
            }

            container.appendChild(mediaEl);
        }
    </script>
</body>

</html>
