<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>MiniKick Overlay</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: transparent;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        .media-layer {
            position: absolute;
        }
    </style>
</head>

<body>
    <div id="container"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token') || '';
        const container = document.getElementById('container');

        const alertQueue = [];
        let isPlaying = false;
        let eventSource = null;
        let reconnectTimer = null;

        function connectSSE() {
            if (eventSource) {
                try { eventSource.close(); } catch (e) {}
                eventSource = null;
            }

            eventSource = new EventSource(`/events?token=${token}`);

            eventSource.onopen = function () {
                console.log("[Rewards Overlay] Conectado exitosamente.");
                if (reconnectTimer) {
                    clearInterval(reconnectTimer);
                    reconnectTimer = null;
                }
            };

            eventSource.onmessage = function (event) {
                try {
                    const data = JSON.parse(event.data);
                    alertQueue.push(data);
                    processQueue();
                } catch (e) {
                    console.error("Error parseando evento SSE:", e);
                }
            };

            eventSource.onerror = function (err) {
                console.warn("[Rewards Overlay] Conexión perdida o rechazada. Reintentando...");
                if (eventSource) {
                    try { eventSource.close(); } catch (e) {}
                    eventSource = null;
                }
                scheduleReconnect();
            };
        }

        function scheduleReconnect() {
            if (!reconnectTimer) {
                reconnectTimer = setInterval(() => {
                    console.log("[Rewards Overlay] Intentando reconectar SSE...");
                    connectSSE();
                }, 3000);
            }
        }

        connectSSE();

        function processQueue() {
            if (isPlaying || alertQueue.length === 0) {
                return;
            }

            isPlaying = true;
            const currentAlert = alertQueue.shift();
            playAlert(currentAlert);
        }

        function playAlert(data) {
            const mediaEl = document.createElement('video');
            mediaEl.src = data.file_url;
            mediaEl.className = 'media-layer';
            mediaEl.autoplay = true;

            mediaEl.volume = data.volume !== undefined ? data.volume : 1.0;

            const scale = data.scale || 1.0;
            mediaEl.style.transform = `scale(${scale})`;
            mediaEl.style.transformOrigin = "top left";

            if (data.is_random_pos) {
                const randX = Math.floor(Math.random() * 75);
                const randY = Math.floor(Math.random() * 75);
                mediaEl.style.left = randX + "%";
                mediaEl.style.top = randY + "%";
            } else {
                const px = data.pos_x || 0;
                const py = data.pos_y || 0;
                mediaEl.style.left = px + "px";
                mediaEl.style.top = py + "px";
            }

            const onMediaFinished = () => {
                mediaEl.remove();
                isPlaying = false;
                processQueue();
            };

            mediaEl.onended = onMediaFinished;

            mediaEl.onerror = (e) => {
                console.error("Error reproduciendo media:", e);
                onMediaFinished();
            };

            container.appendChild(mediaEl);
        }
    </script>
</body>

</html>
