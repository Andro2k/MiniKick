<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>MiniKick – Music Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link id="theme-style" rel="stylesheet" href="">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --dynamic-accent: #3B82F6;
            --dynamic-bg-start: rgba(20, 24, 33, 0.85);
            --dynamic-bg-end: rgba(10, 12, 18, 0.95);
            --dynamic-glow: rgba(59, 130, 246, 0.4);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: transparent;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }

        #player {
            position: relative;
            opacity: 0;
            transform: translateY(20px) scale(0.96);
            transition:
                opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                background 0.5s ease,
                border-color 0.5s ease,
                box-shadow 0.5s ease;
            pointer-events: none;
            overflow: hidden;
        }

        #player.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        #player.theme-dynamic {
            background: linear-gradient(135deg, var(--dynamic-bg-start), var(--dynamic-bg-end)) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4), 0 0 20px var(--dynamic-glow) !important;
            backdrop-filter: blur(16px);
            color: #FFFFFF;
        }

        #player.theme-dynamic .progress-bar-fill {
            background: var(--dynamic-accent) !important;
            box-shadow: 0 0 10px var(--dynamic-accent);
        }

        #player.theme-dynamic .label-now-badge {
            background: rgba(255, 255, 255, 0.15);
            color: var(--dynamic-accent);
            border: 1px solid var(--dynamic-glow);
        }

        #player.theme-dynamic .eq span {
            background: var(--dynamic-accent) !important;
        }

        #player.layout-standard {
            display: flex !important;
            align-items: center !important;
            gap: 18px !important;
            padding: 14px 20px !important;
            border-radius: 20px !important;
            width: clamp(400px, 92vw, 560px) !important;
            box-sizing: border-box !important;
        }

        #player.layout-standard .cover-art-wrap {
            position: relative !important;
            flex-shrink: 0 !important;
            width: 84px !important;
            height: 84px !important;
            border-radius: 16px !important;
            overflow: hidden !important;
            background: rgba(255, 255, 255, 0.05) !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }

        #player.layout-standard .cover-art-wrap img {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
        }

        #player.layout-banner {
            display: flex !important;
            flex-direction: column !important;
            width: clamp(350px, 90vw, 460px) !important;
            border-radius: 22px !important;
            overflow: hidden !important;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6) !important;
            padding: 0 !important;
            box-sizing: border-box !important;
        }

        #player.layout-banner .cover-art-wrap {
            width: 100% !important;
            height: 210px !important;
            position: relative !important;
            overflow: hidden !important;
            border-radius: 0 !important;
            background: rgba(255, 255, 255, 0.05) !important;
        }

        #player.layout-banner .cover-art-wrap img {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
        }

        #player.layout-banner .banner-play-btn {
            position: absolute !important;
            bottom: 16px !important;
            right: 16px !important;
            width: 42px !important;
            height: 42px !important;
            border-radius: 14px !important;
            background: rgba(0, 0, 0, 0.55) !important;
            backdrop-filter: blur(10px) !important;
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            color: #FFFFFF !important;
        }

        #player.layout-banner .banner-play-btn svg {
            width: 22px !important;
            height: 22px !important;
            fill: currentColor !important;
        }

        #player.layout-banner .player-main {
            padding: 18px 22px !important;
            display: flex !important;
            flex-direction: column !important;
            gap: 12px !important;
        }

        #player.layout-pill {
            display: inline-flex !important;
            align-items: center !important;
            gap: 14px !important;
            padding: 8px 22px 8px 12px !important;
            border-radius: 999px !important;
            width: auto !important;
            max-width: none !important;
            overflow: visible !important;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4) !important;
            box-sizing: border-box !important;
        }

        #player.layout-pill .cover-art-wrap {
            display: none !important;
        }

        .pill-art-thumb {
            width: 42px !important;
            height: 42px !important;
            border-radius: 50% !important;
            overflow: hidden !important;
            flex-shrink: 0 !important;
            background: rgba(255, 255, 255, 0.1) !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }

        .pill-art-thumb img {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
        }

        #player.layout-pill .pill-text-wrap {
            display: flex !important;
            align-items: center !important;
            gap: 8px !important;
            white-space: nowrap !important;
            font-size: 15px !important;
        }

        #player.layout-pill .title {
            font-weight: 800 !important;
            font-size: 15px !important;
            color: #FFFFFF !important;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.95) !important;
        }

        #player.layout-pill .pill-dot {
            opacity: 0.6 !important;
            font-weight: 800 !important;
        }

        #player.layout-pill .artist {
            font-weight: 600 !important;
            font-size: 14px !important;
            color: rgba(255, 255, 255, 0.9) !important;
            text-shadow: 0 1.5px 3px rgba(0, 0, 0, 0.9) !important;
            opacity: 0.92 !important;
        }

        #player.layout-pill .pill-progress {
            width: 80px !important;
            height: 5px !important;
            background: rgba(255, 255, 255, 0.2) !important;
            border-radius: 3px !important;
            overflow: hidden !important;
            flex-shrink: 0 !important;
            margin-left: 2px !important;
        }

        .vinyl-disc {
            display: none;
        }

        #player.layout-vinyl .vinyl-disc,
        #player.layout-floating .vinyl-disc {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            width: 96px !important;
            height: 96px !important;
            border-radius: 50% !important;
            background: radial-gradient(circle, #1c1c1c 18%, #090909 20%, #1c1c1c 24%, #090909 38%, #1c1c1c 42%, #050505 100%) !important;
            border: 2px solid #2d2d2d !important;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.7), inset 0 0 5px rgba(255, 255, 255, 0.2) !important;
            position: relative !important;
            flex-shrink: 0 !important;
            z-index: 2 !important;
            transition: transform 0.4s ease !important;
        }

        #player.layout-vinyl.playing .vinyl-disc,
        #player.layout-floating.playing .vinyl-disc {
            animation: spin-vinyl 4s linear infinite !important;
        }

        #player.layout-vinyl:not(.playing) .vinyl-disc,
        #player.layout-floating:not(.playing) .vinyl-disc {
            animation: spin-vinyl 4s linear infinite !important;
            animation-play-state: paused !important;
        }

        .vinyl-center {
            width: 42px !important;
            height: 42px !important;
            border-radius: 50% !important;
            overflow: hidden !important;
            position: relative !important;
            border: 2px solid #000 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }

        .vinyl-center img {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
        }

        .pill-art-thumb .fallback-icon,
        .vinyl-center .fallback-icon {
            width: 100% !important;
            height: 100% !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            background: rgba(255, 255, 255, 0.08) !important;
        }

        .pill-art-thumb .fallback-icon svg,
        .vinyl-center .fallback-icon svg {
            width: 50% !important;
            height: 50% !important;
            stroke: rgba(255, 255, 255, 0.7) !important;
        }

        .vinyl-hole {
            position: absolute !important;
            width: 7px !important;
            height: 7px !important;
            background: #000 !important;
            border-radius: 50% !important;
            border: 1px solid rgba(255, 255, 255, 0.4) !important;
            z-index: 3 !important;
        }

        @keyframes spin-vinyl {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        #player.layout-vinyl,
        #player.layout-floating {
            display: flex !important;
            align-items: center !important;
            gap: 18px !important;
            padding: 14px 20px !important;
            border-radius: 22px !important;
            width: clamp(400px, 90vw, 540px) !important;
            box-sizing: border-box !important;
        }

        #player.layout-vinyl .cover-art-wrap,
        #player.layout-floating .cover-art-wrap {
            display: none !important;
        }

        #player.layout-compact {
            display: flex !important;
            align-items: center !important;
            gap: 14px !important;
            padding: 12px 18px !important;
            border-radius: 16px !important;
            width: clamp(320px, 85vw, 420px) !important;
            box-sizing: border-box !important;
        }

        #player.layout-compact .cover-art-wrap {
            width: 56px !important;
            height: 56px !important;
            border-radius: 12px !important;
            overflow: hidden !important;
            flex-shrink: 0 !important;
        }

        #player.layout-compact .cover-art-wrap img {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
        }

        .cover-art-wrap .fallback-icon {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.08);
        }

        .cover-art-wrap .fallback-icon svg {
            width: 40%;
            height: 40%;
            stroke: rgba(255, 255, 255, 0.7);
        }

        .cover-art-wrap.has-thumbnail .fallback-icon {
            display: none;
        }

        .player-main {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .info {
            flex: 1;
            overflow: hidden;
        }

        .label-now-badge {
            font-size: clamp(9px, 1.8vw, 12px) !important;
            font-weight: 800 !important;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 4px 10px !important;
            border-radius: 6px !important;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3) !important;
        }

        .title {
            font-size: clamp(16px, 2.8vw, 21px) !important;
            font-weight: 800 !important;
            color: #FFFFFF !important;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.95), 0 0 3px rgba(0, 0, 0, 0.85) !important;
        }

        .artist {
            font-size: clamp(12px, 2.0vw, 15px) !important;
            font-weight: 600 !important;
            color: rgba(255, 255, 255, 0.92) !important;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0.95 !important;
            text-shadow: 0 1.5px 3.5px rgba(0, 0, 0, 0.9) !important;
        }

        .progress-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 100%;
        }

        .progress-bar-wrap {
            width: 100%;
            height: 5px !important;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 3px;
            transition: width 0.3s ease;
            background: #FFFFFF;
        }

        .progress-time {
            display: flex;
            justify-content: space-between;
            font-size: 11px !important;
            font-weight: 700 !important;
            color: rgba(255, 255, 255, 0.92) !important;
            opacity: 0.92 !important;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9) !important;
        }

        .eq {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 16px;
            flex-shrink: 0;
        }

        .eq span {
            display: block;
            width: 3px;
            border-radius: 1px;
            height: 3px;
            background: #FFFFFF;
        }

        #player.playing .eq span:nth-child(1) {
            animation: eq-bar 1.0s ease-in-out 0.00s infinite alternate;
        }

        #player.playing .eq span:nth-child(2) {
            animation: eq-bar 1.0s ease-in-out 0.15s infinite alternate;
        }

        #player.playing .eq span:nth-child(3) {
            animation: eq-bar 1.0s ease-in-out 0.30s infinite alternate;
        }

        #player.playing .eq span:nth-child(4) {
            animation: eq-bar 1.0s ease-in-out 0.45s infinite alternate;
        }

        @keyframes eq-bar {
            from {
                height: 3px;
                opacity: 0.55;
            }

            to {
                height: 16px;
                opacity: 1.0;
            }
        }
    </style>
</head>

<body>

    <div id="player">
        <div class="vinyl-disc" id="vinyl-disc">
            <div class="vinyl-center">
                <img id="vinyl-art" src="" alt="Vinyl Art" crossorigin="anonymous" style="display: none;">
                <div class="fallback-icon" id="vinyl-fallback">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 18V6l12-2v12M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zm12-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
                    </svg>
                </div>
                <div class="vinyl-hole"></div>
            </div>
        </div>

        <div class="cover-art-wrap" id="cover-art-wrap">
            <img id="cover-art" src="" alt="Cover Art" crossorigin="anonymous" style="display: none;">
            <div class="fallback-icon" id="cover-fallback">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 18V6l12-2v12M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zm12-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"
                        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
                </svg>
            </div>
            <div class="banner-play-btn" id="banner-play-btn" style="display: none;">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 5v14l11-7z" />
                </svg>
            </div>
        </div>

        <div class="player-main" id="player-main">
            <div class="header-row" id="header-row">
                <div class="info">
                    <div class="artist" id="song-artist">–</div>
                    <div class="title" id="song-title">–</div>
                </div>
                <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0;">
                    <div class="label-now-badge" id="label-now">Now Playing</div>
                    <div class="eq" id="eq-container">
                        <span></span><span></span><span></span><span></span>
                    </div>
                </div>
            </div>

            <div class="progress-container" id="progress-container">
                <div class="progress-bar-wrap">
                    <div class="progress-bar-fill" id="progress-fill"></div>
                </div>
                <div class="progress-time" id="progress-time">
                    <span id="time-current">0:00</span>
                    <span id="time-total">0:00</span>
                </div>
            </div>
        </div>

        <div id="pill-extra" style="display: none; align-items: center; gap: 10px;">
            <div class="pill-art-thumb">
                <img id="pill-art" src="" alt="Art" crossorigin="anonymous" style="display: none;">
                <div class="fallback-icon" id="pill-fallback">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 18V6l12-2v12M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zm12-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
                    </svg>
                </div>
            </div>
            <div class="pill-text-wrap">
                <span class="title" id="pill-title">–</span>
                <span class="pill-dot">•</span>
                <span class="artist" id="pill-artist">–</span>
            </div>
            <div class="pill-progress">
                <div class="progress-bar-fill" id="pill-progress-fill"></div>
            </div>
            <div class="eq" id="pill-eq">
                <span></span><span></span><span></span><span></span>
            </div>
        </div>
    </div>

    <canvas id="color-canvas" width="32" height="32" style="display:none;"></canvas>

    <script>
        const player = document.getElementById('player');
        const elTitle = document.getElementById('song-title');
        const elArtist = document.getElementById('song-artist');
        const elLabel = document.getElementById('label-now');
        const elCover = document.getElementById('cover-art');
        const elWrap = document.getElementById('cover-art-wrap');
        const elBannerBtn = document.getElementById('banner-play-btn');
        const elPillExtra = document.getElementById('pill-extra');
        const elPlayerMain = document.getElementById('player-main');

        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token') || '';
        const theme = urlParams.get('theme') || 'glass';
        const layout = urlParams.get('layout') || 'standard';

        const themeStyle = document.getElementById('theme-style');
        if (theme !== 'dynamic') {
            themeStyle.href = `/music/css/${theme}.css`;
        }
        player.classList.add(`theme-${theme}`);
        player.classList.add(`layout-${layout}`);

        if (layout === 'banner') {
            elBannerBtn.style.display = 'flex';
        } else if (layout === 'pill') {
            elPlayerMain.style.display = 'none';
            elWrap.style.display = 'none';
            elPillExtra.style.display = 'flex';
        } else if (layout === 'vinyl' || layout === 'floating') {
            elWrap.style.display = 'none';
        }

        let hideTimer = null;
        let currentProgress = 0;
        let totalDuration = 0;
        let isPlaying = false;
        let progressTimer = null;

        function extractDynamicColors(imgElement) {
            if (theme !== 'dynamic') return;
            try {
                const canvas = document.getElementById('color-canvas');
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, 32, 32);
                ctx.drawImage(imgElement, 0, 0, 32, 32);

                const imgData = ctx.getImageData(0, 0, 32, 32).data;
                let rSum = 0, gSum = 0, bSum = 0, count = 0;

                for (let i = 0; i < imgData.length; i += 16) {
                    const r = imgData[i];
                    const g = imgData[i + 1];
                    const b = imgData[i + 2];
                    const max = Math.max(r, g, b);
                    const min = Math.min(r, g, b);

                    if (max - min > 20) {
                        rSum += r;
                        gSum += g;
                        bSum += b;
                        count++;
                    }
                }

                if (count === 0) {
                    rSum = 59; gSum = 130; bSum = 246; count = 1;
                }

                const avgR = Math.round(rSum / count);
                const avgG = Math.round(gSum / count);
                const avgB = Math.round(bSum / count);

                const accent = `rgb(${avgR}, ${avgG}, ${avgB})`;
                const bgStart = `rgba(${Math.round(avgR * 0.35)}, ${Math.round(avgG * 0.35)}, ${Math.round(avgB * 0.35)}, 0.9)`;
                const bgEnd = `rgba(${Math.round(avgR * 0.15)}, ${Math.round(avgG * 0.15)}, ${Math.round(avgB * 0.15)}, 0.96)`;
                const glow = `rgba(${avgR}, ${avgG}, ${avgB}, 0.4)`;

                player.style.setProperty('--dynamic-accent', accent);
                player.style.setProperty('--dynamic-bg-start', bgStart);
                player.style.setProperty('--dynamic-bg-end', bgEnd);
                player.style.setProperty('--dynamic-glow', glow);
            } catch (e) {
                console.warn("[Music Overlay] Error extrayendo color dinámico (CORS/canvas):", e);
            }
        }

        if (elCover) {
            elCover.onload = function () {
                extractDynamicColors(elCover);
            };
        }

        function formatTime(ms) {
            if (!ms || isNaN(ms) || ms < 0) return '0:00';
            const totalSecs = Math.floor(ms / 1000);
            const mins = Math.floor(totalSecs / 60);
            const secs = totalSecs % 60;
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function updateProgressUI() {
            const elCurrent = document.getElementById('time-current');
            const elTotal = document.getElementById('time-total');
            const elFill = document.getElementById('progress-fill');
            const elPillFill = document.getElementById('pill-progress-fill');

            if (elCurrent) elCurrent.textContent = formatTime(currentProgress);
            if (elTotal) elTotal.textContent = formatTime(totalDuration);

            const percent = (totalDuration > 0) ? Math.min(100, (currentProgress / totalDuration) * 100) : 0;
            if (elFill) elFill.style.width = `${percent}%`;
            if (elPillFill) elPillFill.style.width = `${percent}%`;
        }

        function startProgressTicker() {
            stopProgressTicker();
            if (!isPlaying) return;

            progressTimer = setInterval(() => {
                if (currentProgress < totalDuration) {
                    currentProgress += 1000;
                    updateProgressUI();
                } else {
                    stopProgressTicker();
                }
            }, 1000);
        }

        function stopProgressTicker() {
            clearInterval(progressTimer);
        }

        function updateThumb(imgEl, fallbackEl, url) {
            if (!imgEl || !fallbackEl) return;
            if (url) {
                imgEl.src = url;
                imgEl.style.display = 'block';
                fallbackEl.style.display = 'none';
                imgEl.onerror = function () {
                    imgEl.style.display = 'none';
                    fallbackEl.style.display = 'flex';
                };
            } else {
                imgEl.src = '';
                imgEl.style.display = 'none';
                fallbackEl.style.display = 'flex';
            }
        }

        function showPlayer(title, artist, playing, thumbnail, progress, duration) {
            clearTimeout(hideTimer);
            elTitle.textContent = title || '–';
            elArtist.textContent = artist || '–';
            elLabel.textContent = playing ? 'Now Playing' : 'Paused';

            const elPillTitle = document.getElementById('pill-title');
            const elPillArtist = document.getElementById('pill-artist');

            if (elPillTitle) elPillTitle.textContent = title || '–';
            if (elPillArtist) elPillArtist.textContent = artist || '–';

            updateThumb(elCover, document.getElementById('cover-fallback'), thumbnail);
            updateThumb(document.getElementById('pill-art'), document.getElementById('pill-fallback'), thumbnail);
            updateThumb(document.getElementById('vinyl-art'), document.getElementById('vinyl-fallback'), thumbnail);

            isPlaying = playing;
            currentProgress = progress || 0;
            totalDuration = duration || 0;

            updateProgressUI();
            startProgressTicker();

            player.classList.toggle('playing', isPlaying);
            player.classList.add('visible');
        }

        function scheduleHide(delayMs) {
            clearTimeout(hideTimer);
            hideTimer = setTimeout(() => {
                player.classList.remove('visible', 'playing');
                stopProgressTicker();
            }, delayMs);
        }

        let ws = null;
        let reconnectTimer = null;
        let heartbeatTimer = null;

        function connectWS() {
            if (ws) {
                try { ws.close(); } catch (e) { }
                ws = null;
            }

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws?topic=music&token=${encodeURIComponent(token)}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = function () {
                console.log("[Music Overlay] WebSocket conectado exitosamente.");
                if (reconnectTimer) {
                    clearInterval(reconnectTimer);
                    reconnectTimer = null;
                }
                heartbeatTimer = setInterval(() => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'ping' }));
                    }
                }, 15000);
            };

            ws.onmessage = function (event) {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'pong') return;

                    if (data.type === 'stopped') {
                        scheduleHide(3000);
                        return;
                    }

                    if (data.type === 'playing') {
                        showPlayer(
                            data.title,
                            data.artist,
                            data.is_playing,
                            data.thumbnail,
                            data.progress,
                            data.duration
                        );

                        if (!data.is_playing) {
                            scheduleHide(8000);
                        }
                    }
                } catch (e) {
                    console.error("Error parseando evento de música WebSocket:", e);
                }
            };

            ws.onerror = function () {
                scheduleHide(5000);
                console.warn("[Music Overlay] Error en WebSocket. Reintentando...");
                cleanup();
                scheduleReconnect();
            };

            ws.onclose = function () {
                scheduleHide(5000);
                console.warn("[Music Overlay] WebSocket cerrado. Reintentando...");
                cleanup();
                scheduleReconnect();
            };
        }

        function cleanup() {
            if (heartbeatTimer) {
                clearInterval(heartbeatTimer);
                heartbeatTimer = null;
            }
        }

        function scheduleReconnect() {
            if (!reconnectTimer) {
                reconnectTimer = setInterval(() => {
                    console.log("[Music Overlay] Intentando reconectar WebSocket...");
                    connectWS();
                }, 3000);
            }
        }

        connectWS();
    </script>
</body>
