<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniKick Custom Alert Example</title>
    <!-- 
        PLANTILLA DE EJEMPLO PARA ALERTAS PERSONALIZADAS EN MINIKICK
        ============================================================
        Puedes usar este archivo como base para crear tus propias alertas interactivas.
        
        ¿CÓMO FUNCIONA?
        1. MiniKick carga este archivo en un iframe transparente dentro del overlay.
        2. MiniKick envía un evento 'onEventReceived' con todos los datos de la alerta:
           - data.username: Nombre del usuario (ej: 'TheAndro2K')
           - data.message: Mensaje adjunto (sub / cheer)
           - data.amount: Cantidad (bits o meses de sub)
           - data.platform: Plataforma ('kick' o 'twitch')
           - data.alert_type: Tipo de evento ('follow', 'subscription', 'cheer', etc.)
        3. Cuando tu animación termine, puedes llamar opcionalmente:
           window.parent.postMessage({ type: 'minikick:finish_alert' }, '*');
           para cerrar la alerta antes del temporizador de MiniKick.
    -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .alert-box {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(18, 20, 26, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 20px 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 25px rgba(83, 252, 24, 0.3);
            text-align: center;
            transform: scale(0.8) translateY(20px);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 440px;
        }

        .alert-box.show {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .badge {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 8px;
            color: #000;
            background: #53fc18;
        }

        .badge.twitch {
            background: #9146ff;
            color: #fff;
        }

        .user-name {
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .action-text {
            font-size: 14px;
            color: #b3b9c5;
            margin-top: 4px;
        }

        .sub-message {
            margin-top: 10px;
            font-size: 13px;
            font-style: italic;
            color: #e2e8f0;
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 12px;
            border-radius: 8px;
            max-width: 360px;
            word-break: break-word;
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>

    <div class="alert-box" id="alertBox">
        <span class="badge" id="platformBadge">KICK</span>
        <div class="user-name" id="userName">¡Nuevo Seguidor!</div>
        <div class="action-text" id="actionText">se ha unido a la comunidad</div>
        <div class="sub-message" id="subMessage" style="display: none;"></div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createParticles(color) {
            particles = [];
            const count = 40;
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 6;
                particles.push({
                    x: cx,
                    y: cy,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1.5,
                    size: 3 + Math.random() * 4,
                    color: color,
                    alpha: 1,
                    decay: 0.015 + Math.random() * 0.02
                });
            }
        }

        function updateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            if (particles.length > 0) {
                requestAnimationFrame(updateParticles);
            }
        }

        // Receptor de eventos de MiniKick
        window.addEventListener('message', function (event) {
            const data = event.data;
            if (!data || data.type !== 'onEventReceived' || !data.detail) return;

            const alertData = data.detail.event || {};
            const platform = (alertData.platform || 'kick').toLowerCase();
            const accentColor = platform === 'twitch' ? '#9146ff' : '#53fc18';

            // Actualizar elementos visuales
            const badge = document.getElementById('platformBadge');
            badge.textContent = platform.toUpperCase();
            badge.className = 'badge ' + platform;

            const userElem = document.getElementById('userName');
            userElem.textContent = alertData.username || 'Espectador';

            const actionElem = document.getElementById('actionText');
            actionElem.textContent = alertData.formatted_text || '¡Gracias por el apoyo!';

            const msgElem = document.getElementById('subMessage');
            if (alertData.message) {
                msgElem.textContent = '"' + alertData.message + '"';
                msgElem.style.display = 'block';
            } else {
                msgElem.style.display = 'none';
            }

            const alertBox = document.getElementById('alertBox');
            alertBox.style.boxShadow = `0 15px 35px rgba(0, 0, 0, 0.6), 0 0 25px ${accentColor}55`;
            alertBox.classList.add('show');

            createParticles(accentColor);
            requestAnimationFrame(updateParticles);

            // Ejemplo: finalizar animación a los 4.5 segundos si se desea
            setTimeout(() => {
                alertBox.classList.remove('show');
                setTimeout(() => {
                    // Notificar a MiniKick que la alerta ha finalizado
                    window.parent.postMessage({ type: 'minikick:finish_alert' }, '*');
                }, 400);
            }, 4500);
        });
    </script>
</body>

</html>
