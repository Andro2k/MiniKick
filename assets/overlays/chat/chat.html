<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>MiniKick Chat Overlay</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link id="theme-style" rel="stylesheet" href="">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <style>
        :root {
            --font-size: 14px;
        }

        body {
            margin: 0;
            padding: 16px 24px;
            overflow: hidden;
            background-color: transparent;
            height: 100vh;
            width: 100vw;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
        }

        #chat-container {
            display: flex;
            gap: 12px;
            height: 100%;
            width: 100%;
            box-sizing: border-box;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        #chat-container::-webkit-scrollbar {
            display: none;
        }

        #chat-container.orientation-vertical.flow-bottom-to-top {
            flex-direction: column;
            justify-content: flex-end;
            overflow-y: auto;
            overflow-x: hidden;
        }

        #chat-container.orientation-vertical.flow-bottom-to-top .message-box:first-child {
            margin-top: auto !important;
        }

        #chat-container.orientation-vertical.flow-top-to-bottom {
            flex-direction: column-reverse;
            justify-content: flex-end;
            overflow-y: auto;
            overflow-x: hidden;
        }

        #chat-container.orientation-horizontal {
            flex-wrap: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            align-items: center;
            height: 100%;
        }

        #chat-container.orientation-horizontal.flow-right-to-left {
            flex-direction: row;
            justify-content: flex-end;
        }

        #chat-container.orientation-horizontal.flow-right-to-left .message-box:first-child {
            margin-left: auto !important;
        }

        #chat-container.orientation-horizontal.flow-left-to-right {
            flex-direction: row-reverse;
            justify-content: flex-end;
        }

        #chat-container.orientation-horizontal .message-box {
            display: inline-flex !important;
            flex-direction: row !important;
            align-items: center !important;
            gap: 8px !important;
            padding: 6px 16px !important;
            width: auto !important;
            min-width: 100px !important;
            max-width: none !important;
            flex-shrink: 0 !important;
            white-space: nowrap !important;
            align-self: center !important;
            margin-top: 0 !important;
            margin-bottom: 0 !important;
        }

        #chat-container.orientation-horizontal .message-header {
            display: inline-flex !important;
            align-items: center !important;
            flex-shrink: 0 !important;
            gap: 6px !important;
            position: static !important;
            width: auto !important;
            background: transparent !important;
            border: none !important;
            padding: 0 !important;
            margin: 0 !important;
            white-space: nowrap !important;
        }

        #chat-container.orientation-horizontal .username::after {
            content: ":";
            margin-left: 1px;
            opacity: 0.85;
        }

        #chat-container.orientation-horizontal .message-content {
            display: inline-block !important;
            white-space: nowrap !important;
            overflow: visible !important;
            text-overflow: clip !important;
            max-width: none !important;
            vertical-align: middle !important;
        }

        #chat-container.orientation-horizontal .message-box.theme-card {
            display: inline-flex !important;
            flex-direction: row !important;
            align-items: center !important;
            position: relative !important;
            padding: 0 16px !important;
            height: 40px !important;
            margin-top: 0 !important;
            margin-bottom: 0 !important;
            overflow: visible !important;
            background: #FFFFFF !important;
            border-radius: 12px !important;
        }

        #chat-container.orientation-horizontal .message-box.theme-card .message-header {
            display: inline-flex !important;
            align-items: center !important;
            position: static !important;
            height: 100% !important;
            border-bottom: none !important;
            background: transparent !important;
            padding: 0 !important;
            margin: 0 !important;
            width: auto !important;
            gap: 6px !important;
        }

        #chat-container.orientation-horizontal .message-box.theme-card .username {
            margin: 0 !important;
            display: inline-block !important;
        }

        #chat-container.orientation-horizontal .message-box.theme-card .card-win-buttons {
            position: static !important;
            display: inline-flex !important;
            align-items: center !important;
            margin-right: 2px !important;
        }

        #chat-container.orientation-horizontal .message-box.theme-card .card-float-badge {
            position: static !important;
            top: auto !important;
            left: auto !important;
            margin: 0 4px 0 0 !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            font-size: calc(var(--font-size) * 0.72) !important;
            padding: 2px 8px !important;
            line-height: 1 !important;
            white-space: nowrap !important;
            box-shadow: none !important;
            border-radius: 10px !important;
            vertical-align: middle !important;
        }

        #chat-container.orientation-horizontal .message-box.theme-card .message-content {
            padding: 0 !important;
            margin-left: 4px !important;
            text-align: left !important;
            font-size: var(--font-size) !important;
            font-weight: 600 !important;
            color: #1b1e22 !important;
        }

        #chat-container.orientation-horizontal .message-box.theme-cyber {
            display: inline-flex !important;
            flex-direction: row !important;
            align-items: center !important;
            position: relative !important;
            padding: 6px 16px 6px 28px !important;
            margin-top: 2px !important;
            margin-bottom: 2px !important;
            gap: 8px !important;
        }

        #chat-container.orientation-horizontal .message-box.theme-cyber::before {
            position: absolute !important;
            left: 8px !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
        }

        #chat-container.orientation-horizontal .message-box.theme-cyber::after {
            display: none !important;
        }

        #chat-container.orientation-horizontal .message-box.theme-cyber .message-header {
            display: inline-flex !important;
            align-items: center !important;
            position: static !important;
            gap: 6px !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        #chat-container.orientation-horizontal .message-box.theme-minimal {
            display: inline-flex !important;
            flex-direction: row !important;
            align-items: center !important;
            padding: 6px 14px !important;
            gap: 8px !important;
            margin-top: 0 !important;
        }

        #chat-container.orientation-horizontal .message-box.theme-minimal .message-header {
            display: inline-flex !important;
            align-items: center !important;
            gap: 6px !important;
        }

        .chat-emote {
            height: 32px;
            vertical-align: middle;
            margin: -2px 2px;
            display: inline-block;
        }

        .message-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 12px 16px;
            box-sizing: border-box;
            width: 100%;
            position: relative;
            transform-origin: center;
            transition: opacity 0.4s ease, transform 0.4s ease, box-shadow 0.3s ease, border-color 0.3s ease !important;
            will-change: transform, opacity;
            transform: translate3d(0, 0, 0);
        }

        .message-box.fade-out {
            opacity: 0;
            transform: translate3d(0, -15px, 0) scale(0.95);
            pointer-events: none;

        }

        .anim-entry-bottom {
            animation: slideInFromBottom 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .anim-entry-top {
            animation: slideInFromTop 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;

        }

        .anim-entry-left {
            animation: slideInFromLeft 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;

        }

        .anim-entry-right {
            animation: slideInFromRight 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;

        }

        @keyframes slideInFromBottom {
            from {
                opacity: 0;
                transform: translate3d(0, 35px, 0) scale(0.92);
            }

            to {
                opacity: 1;
                transform: translate3d(0, 0, 0) scale(1);
            }
        }

        @keyframes slideInFromTop {
            from {
                opacity: 0;
                transform: translate3d(0, -35px, 0) scale(0.92);
            }

            to {
                opacity: 1;
                transform: translate3d(0, 0, 0) scale(1);
            }
        }

        @keyframes slideInFromLeft {
            from {
                opacity: 0;
                transform: translate3d(-40px, 0, 0) scale(0.92);
            }

            to {
                opacity: 1;
                transform: translate3d(0, 0, 0) scale(1);
            }
        }

        @keyframes slideInFromRight {
            from {
                opacity: 0;
                transform: translate3d(40px, 0, 0) scale(0.92);
            }

            to {
                opacity: 1;
                transform: translate3d(0, 0, 0) scale(1);
            }
        }

        .message-header {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .badge {
            font-family: 'Outfit', sans-serif;
            font-size: calc(var(--font-size) * 0.85);
            font-weight: 700;
            text-transform: uppercase;
            padding: 0;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.3em;
            height: 1.3em;
        }

        .badge-broadcaster {
            background-color: rgba(239, 68, 68, 0.2);
            color: #EF4444;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .badge-moderator {
            background-color: rgba(46, 205, 112, 0.2);
            color: #2ECD70;
            border: 1px solid rgba(46, 205, 112, 0.4);
        }

        .badge-vip {
            background-color: rgba(192, 132, 252, 0.2);
            color: #C084FC;
            border: 1px solid rgba(192, 132, 252, 0.4);
        }

        .badge-subscriber {
            background-color: rgba(59, 130, 246, 0.2);
            color: #3B82F6;
            border: 1px solid rgba(59, 130, 246, 0.4);
        }

        .badge-bot {
            background-color: rgba(156, 163, 175, 0.2);
            color: #9CA3AF;
            border: 1px solid rgba(156, 163, 175, 0.4);
        }

        .badge-og {
            background-color: rgba(245, 158, 11, 0.2);
            color: #F59E0B;
            border: 1px solid rgba(245, 158, 11, 0.4);
        }

        .badge-level {
            width: auto;
            min-width: 1.4em;
            padding: 0 5px;
            border-radius: 8px;
            font-size: calc(var(--font-size) * 0.72);
            background-color: rgba(46, 205, 112, 0.2);
            color: #2ECD70;
            border: 1px solid rgba(46, 205, 112, 0.4);
        }

        .username {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: calc(var(--font-size) + 1px);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .message-content {
            font-size: var(--font-size);
            line-height: 1.5;
            word-wrap: break-word;
            word-break: break-word;
        }

        .timestamp {
            font-size: calc(var(--font-size) - 3px);
            color: #FFFFFF;
            margin-right: 4px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div id="chat-container"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token') || '';
        const theme = urlParams.get('theme') || 'glass';
        const fadeTime = urlParams.get('fade') !== null ? parseInt(urlParams.get('fade')) : 15;
        const fontSize = urlParams.get('size') || '14px';
        const maxMessages = parseInt(urlParams.get('max')) || 15;
        const showBots = urlParams.get('show_bots') !== 'false';
        const showTime = urlParams.get('show_time') === 'true';
        const orientation = urlParams.get('orientation') || 'vertical';
        const defaultFlow = orientation === 'horizontal' ? 'right-to-left' : 'bottom-to-top';
        const flow = urlParams.get('flow') || defaultFlow;
        const defaultEntry = orientation === 'horizontal' ? 'right' : 'bottom';
        const entryDir = urlParams.get('entry') || defaultEntry;
        const themeStyle = document.getElementById('theme-style');
        themeStyle.href = `/chat/css/${theme}.css`;

        document.documentElement.style.setProperty('--font-size', fontSize);

        const container = document.getElementById('chat-container');
        container.classList.add(`orientation-${orientation}`);
        container.classList.add(`flow-${flow}`);
        let ws = null;
        let reconnectTimer = null;
        let heartbeatTimer = null;

        function connectWS() {
            if (ws) {
                try { ws.close(); } catch (e) { }
                ws = null;
            }

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws?topic=chat&token=${encodeURIComponent(token)}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = function () {
                console.log("[Chat Overlay] WebSocket conectado exitosamente.");
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }
                heartbeatTimer = setInterval(() => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'ping' }));
                    }
                }, 15000);
            };

            ws.onmessage = function (event) {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'pong') return;
                    addMessage(data);
                } catch (e) {
                    console.error("Error parseando evento de chat WebSocket:", e);
                }
            };

            ws.onerror = function (err) {
                console.warn("[Chat Overlay] Error en WebSocket. Reintentando...");
                cleanup();
                scheduleReconnect();
            };

            ws.onclose = function () {
                console.warn("[Chat Overlay] WebSocket cerrado. Reintentando...");
                cleanup();
                scheduleReconnect();
            };
        }

        function cleanup() {
            if (heartbeatTimer) {
                clearInterval(heartbeatTimer);
                heartbeatTimer = null;
            }
        }

        function scheduleReconnect() {
            if (reconnectTimer) clearTimeout(reconnectTimer);
            reconnectTimer = setTimeout(() => {
                connectWS();
            }, 3000);
        }

        connectWS();

        function addMessage(data) {
            if (!showBots && data.badges && data.badges.includes('bot')) {
                return;
            }

            let roleClass = 'default';
            let roleLabel = 'USER';
            if (data.badges && Array.isArray(data.badges)) {
                if (data.badges.includes('broadcaster')) {
                    roleLabel = 'STREAMER';
                    roleClass = 'broadcaster';
                } else if (data.badges.includes('moderator')) {
                    roleLabel = 'MODERATOR';
                    roleClass = 'moderator';
                } else if (data.badges.includes('vip')) {
                    roleLabel = 'VIP';
                    roleClass = 'vip';
                } else if (data.badges.includes('subscriber')) {
                    roleLabel = 'SUBSCRIBER';
                    roleClass = 'subscriber';
                } else if (data.badges.includes('bot')) {
                    roleLabel = 'BOT';
                    roleClass = 'bot';
                }
            }

            const msgBox = document.createElement('div');
            msgBox.className = `message-box theme-${theme} role-${roleClass} anim-entry-${entryDir}`;
            msgBox.style.fontSize = fontSize;

            if (theme === 'neon') {
                const glowColor = data.color || '#2ECD70';
                msgBox.style.borderColor = glowColor;
                msgBox.style.boxShadow = `0 0 10px ${glowColor}, inset 0 0 5px ${glowColor}`;
            }

            if (theme === 'minimal') {
                const lineColor = data.color || '#C084FC';
                msgBox.style.setProperty('--line-color', lineColor);
            }

            if (theme === 'cyber') {
                const cyberColor = data.color || '#00ff66';
                msgBox.style.setProperty('--cyber-color', cyberColor);
            }

            const header = document.createElement('div');
            header.className = 'message-header';

            if (theme === 'card') {
                const floatBadge = document.createElement('div');
                floatBadge.className = 'card-float-badge';
                floatBadge.innerText = roleLabel;

                const nameSpan = document.createElement('span');
                nameSpan.className = 'username';
                nameSpan.innerText = data.user;

                if (data.color) {
                    nameSpan.style.color = data.color;

                    let bgTint = data.color + '33';
                    if (data.color.startsWith('#')) {
                        let hex = data.color.replace('#', '');
                        if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
                        if (hex.length === 6) {
                            const r = parseInt(hex.substring(0, 2), 16);
                            const g = parseInt(hex.substring(2, 4), 16);
                            const b = parseInt(hex.substring(4, 6), 16);
                            bgTint = `rgba(${r}, ${g}, ${b}, 0.22)`;
                        }
                    }
                    header.style.backgroundColor = bgTint;
                }

                const winButtons = document.createElement('div');
                winButtons.className = 'card-win-buttons';

                let timeHtml = '';
                if (showTime) {
                    const now = new Date();
                    const hours = String(now.getHours()).padStart(2, '0');
                    const minutes = String(now.getMinutes()).padStart(2, '0');
                    timeHtml = `<span class="card-time-btn">${hours}:${minutes}</span>`;
                }

                winButtons.innerHTML = `${timeHtml}`;

                header.appendChild(floatBadge);
                header.appendChild(nameSpan);
                header.appendChild(winButtons);
            } else {
                if (showTime) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'timestamp';
                    const now = new Date();
                    const hours = String(now.getHours()).padStart(2, '0');
                    const minutes = String(now.getMinutes()).padStart(2, '0');
                    timeSpan.innerText = `[${hours}:${minutes}]`;
                    header.appendChild(timeSpan);
                }

                if (data.badges && Array.isArray(data.badges)) {
                    data.badges.forEach(badge => {
                        const badgeSpan = document.createElement('span');
                        if (typeof badge === 'string' && badge.startsWith('level_')) {
                            const lvl = badge.replace('level_', '');
                            badgeSpan.className = 'badge badge-level';
                            badgeSpan.innerText = `Lvl ${lvl}`;
                            badgeSpan.title = `Nivel ${lvl}`;
                        } else {
                            badgeSpan.className = `badge badge-${badge}`;
                            let iconClass = 'ti ti-star';
                            if (badge === 'broadcaster') iconClass = 'ti ti-crown';
                            else if (badge === 'moderator') iconClass = 'ti ti-shield';
                            else if (badge === 'vip') iconClass = 'ti ti-diamond';
                            else if (badge === 'subscriber') iconClass = 'ti ti-star';
                            else if (badge === 'og') iconClass = 'ti ti-sparkles';
                            else if (badge === 'bot') iconClass = 'ti ti-robot';

                            badgeSpan.innerHTML = `<i class="${iconClass}"></i>`;
                            badgeSpan.title = getBadgeLabel(badge);
                        }
                        header.appendChild(badgeSpan);
                    });
                }

                const nameSpan = document.createElement('span');
                nameSpan.className = 'username';
                nameSpan.style.color = data.color || '#FAFAFA';
                nameSpan.innerText = data.user;
                if (theme === 'neon') {
                    const glowColor = data.color || '#2ECD70';
                    nameSpan.style.textShadow = `0 0 8px ${glowColor}, 0 1px 2px rgba(0, 0, 0, 0.9)`;
                }
                header.appendChild(nameSpan);
            }

            msgBox.appendChild(header);

            const content = document.createElement('div');
            content.className = 'message-content';

            let safeMsg = escapeHtml(data.message);
            const emoteRegex = /\[emote:(\d+):([^\]]+)\]/g;
            safeMsg = safeMsg.replace(emoteRegex, (match, id, name) => {
                return `<img src="https://files.kick.com/emotes/${id}/fullsize" alt="${name}" title="${name}" class="chat-emote" loading="lazy" decoding="async" />`;
            });

            const textSpan = document.createElement('span');
            textSpan.innerHTML = safeMsg;
            content.appendChild(textSpan);
            msgBox.appendChild(content);

            container.appendChild(msgBox);

            const activeMessages = Array.from(container.children).filter(child => !child.classList.contains('fade-out'));
            if (activeMessages.length > maxMessages) {
                const toRemoveCount = activeMessages.length - maxMessages;
                for (let i = 0; i < toRemoveCount; i++) {
                    removeMessage(activeMessages[i]);
                }
            }

            if (orientation === 'horizontal') {
                if (flow === 'right-to-left') {
                    container.scrollLeft = container.scrollWidth;
                } else {
                    container.scrollLeft = 0;
                }
            } else {
                if (flow === 'bottom-to-top') {
                    container.scrollTop = container.scrollHeight;
                } else {
                    container.scrollTop = 0;
                }
            }

            if (fadeTime > 0) {
                setTimeout(() => {
                    removeMessage(msgBox);
                }, fadeTime * 1000);
            }
        }

        function removeMessage(msgBox) {
            if (msgBox.classList.contains('fade-out')) return;
            msgBox.classList.add('fade-out');
            setTimeout(() => {
                if (msgBox.parentNode === container) {
                    container.removeChild(msgBox);
                }
            }, 400);
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function getBadgeLabel(badge) {
            const labels = {
                'broadcaster': 'Streamer',
                'moderator': 'Mod',
                'vip': 'VIP',
                'subscriber': 'Sub',
                'bot': 'Bot'
            };
            return labels[badge] || badge;
        }
    </script>
</body>

</html>
