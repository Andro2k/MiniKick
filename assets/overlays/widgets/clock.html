<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniKick - Date & Time Clock OBS Overlay (Responsive)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap');

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: transparent !important;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        *,
        *::before,
        *::after {
            box-sizing: inherit;
        }

        #clock-container {
            max-width: 100%;
            max-height: 100%;
            padding: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: opacity 0.4s ease;
        }

        #clock-container.hidden {
            display: none !important;
        }

        .clock-capsule {
            display: flex;
            flex-wrap: wrap-reverse; 
            align-items: center;
            justify-content: center;
            column-gap: 24px;
            row-gap: 12px;
            padding: 12px 24px;
            background: rgba(24, 24, 27, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            color: #ffffff;
            zoom: 1.2;
        }

        .time-segment {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #ffffff;
            font-weight: 800;
            line-height: 1;
            white-space: nowrap;
        }

        .time-main {
            font-size: 56px;
            letter-spacing: 1px;
        }

        .time-meta {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            gap: 2px;
        }

        .time-seconds {
            font-size: 16px;
            color: #a1a1aa;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .time-period {
            font-size: 16px;
            color: #a1a1aa;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .date-segment {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            color: #e4e4e7;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            white-space: nowrap;
        }

        .date-segment.hidden {
            display: none !important;
        }
        
        .date-arrow {
            color: #a1a1aa;
            margin: 0 6px;
            font-weight: 900;
        }

    </style>
</head>

<body>

    <div id="clock-container">
        <div id="clock-capsule" class="clock-capsule">
            
            <div id="date-segment" class="date-segment">
                <span id="date-day">MON</span>
                <span class="date-arrow">→</span>
                <span id="date-full">21 JUL</span>
            </div>

            <div class="time-segment">
                <span id="time-main" class="time-main">08:56</span>
                <div class="time-meta">
                    <span id="time-seconds" class="time-seconds" style="display: none;">00</span>
                    <span id="time-period" class="time-period">PM</span>
                </div>
            </div>
            
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const lang = (urlParams.get('lang') || 'es').toLowerCase();
        const timeFormat = (urlParams.get('format') || '12h').toLowerCase();
        const showDateParam = urlParams.get('date');
        const showDate = showDateParam !== 'false';
        const showSeconds = urlParams.get('seconds') === 'true';

        const capsuleEl = document.getElementById('clock-capsule');
        const dateSegmentEl = document.getElementById('date-segment');
        const dateDayEl = document.getElementById('date-day');
        const dateFullEl = document.getElementById('date-full');
        const timeMainEl = document.getElementById('time-main');
        const timeSecondsEl = document.getElementById('time-seconds');
        const timePeriodEl = document.getElementById('time-period');


        if (!showDate) {
            dateSegmentEl.classList.add('hidden');
        }

        if (showSeconds) {
            timeSecondsEl.style.display = 'block';
        }

        const MONTHS_ES = [
            'Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun',
            'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'
        ];
        const DAYS_ES = [
            'DOM', 'LUN', 'MAR', 'MIÉ', 'JUE', 'VIE', 'SÁB'
        ];

        const MONTHS_EN = [
            'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
            'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'
        ];
        const DAYS_EN = [
            'SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'
        ];

        function updateClock() {
            const now = new Date();

            if (showDate) {
                const dayName = (lang === 'en' ? DAYS_EN : DAYS_ES)[now.getDay()];
                const monthName = (lang === 'en' ? MONTHS_EN : MONTHS_ES)[now.getMonth()];
                const dayNum = now.getDate();

                dateDayEl.textContent = dayName;
                
                if (lang === 'en') {
                    dateFullEl.textContent = `${dayNum} ${monthName.toUpperCase()}`;
                } else {
                    dateFullEl.textContent = `${dayNum} ${monthName.toUpperCase()}`;
                }
            }

            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            if (timeFormat === '24h') {
                timeMainEl.textContent = `${String(hours).padStart(2, '0')}:${minutes}`;
                timePeriodEl.style.display = 'none';
            } else {
                const period = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12;
                if (hours === 0) hours = 12;
                timeMainEl.textContent = `${String(hours).padStart(2, '0')}:${minutes}`;
                timePeriodEl.textContent = period;
                timePeriodEl.style.display = 'block';
            }

            if (showSeconds) {
                timeSecondsEl.textContent = seconds;
            }
        }

        updateClock();
        setInterval(updateClock, 1000);

        if (window.location.protocol !== 'file:') {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws?topic=widgets&token=${encodeURIComponent(token || '')}`;
            try {
                const ws = new WebSocket(wsUrl);
                ws.onmessage = function (e) {
                    try {
                        const data = JSON.parse(e.data);
                        if (data.event === 'widget_toggle' && data.widget_id === 'clock') {
                            const container = document.getElementById('clock-container');
                            if (data.is_active === false) {
                                container.classList.add('hidden');
                            } else {
                                container.classList.remove('hidden');
                            }
                        }
                    } catch (err) {}
                };
            } catch (err) {}
        }
    </script>
</body>

</html>
