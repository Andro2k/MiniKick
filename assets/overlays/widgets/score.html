<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniKick - Score Record OBS Overlay</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        body {
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        .score-badge {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 260px;
            min-height: 54px;
            background: rgba(13, 17, 23, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(56, 189, 248, 0.4);
            border-radius: 16px;
            padding: 10px 22px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 25px rgba(56, 189, 248, 0.2);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.3s ease;
        }

        .score-badge.bump {
            animation: pulse-bump 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pulse-bump {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); border-color: #38bdf8; box-shadow: 0 0 35px rgba(56, 189, 248, 0.5); }
            100% { transform: scale(1); }
        }

        .icon-box {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            background: rgba(255, 215, 0, 0.12);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            flex-shrink: 0;
        }

        .trophy-svg {
            width: 26px;
            height: 26px;
            filter: drop-shadow(0 2px 6px rgba(255, 215, 0, 0.5));
        }

        .text-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2px;
        }

        .score-title {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.4px;
            color: #38bdf8;
        }

        .score-counts {
            font-size: 22px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 8px;
            line-height: 1;
        }

        .win-tag {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #2ed573;
            text-shadow: 0 0 12px rgba(46, 213, 115, 0.4);
        }

        .loss-tag {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #ff4757;
            text-shadow: 0 0 12px rgba(255, 71, 87, 0.4);
        }

        .score-divider {
            color: #484f58;
            font-size: 16px;
            font-weight: 700;
        }

        .stat-icon {
            width: 14px;
            height: 14px;
        }
    </style>
</head>
<body>

    <div class="score-badge" id="scoreBadge">
        <div class="icon-box">
            <svg class="trophy-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 5H17V3H7V5H5C3.9 5 3 5.9 3 7V9C3 11.21 4.79 13 7 13H7.54C8.28 14.79 10.03 16 12 16C13.97 16 15.72 14.79 16.46 13H17C19.21 13 21 11.21 21 9V7C21 5.9 20.1 5 19 5ZM5 9V7H7V9H5ZM19 9H17V7H19V9ZM10 18H14V20H10V18ZM8 21H16V22H8V21Z" fill="url(#trophy-grad)"/>
                <defs>
                    <linearGradient id="trophy-grad" x1="3" y1="3" x2="21" y2="22" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#ffd700"/>
                        <stop offset="100%" stop-color="#ffaa00"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>
        <div class="text-container">
            <div class="score-title" id="scoreTitle">RÉCORD V / D</div>
            <div class="score-counts">
                <span class="win-tag">
                    <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="#2ed573" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    <span id="winCount">0 W</span>
                </span>
                <span class="score-divider">-</span>
                <span class="loss-tag">
                    <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="#ff4757" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                    <span id="lossCount">0 L</span>
                </span>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token') || '';
        const lang = (params.get('lang') || 'es').toLowerCase();
        const port = window.location.port || '8099';

        const scoreBadge = document.getElementById('scoreBadge');
        const scoreTitle = document.getElementById('scoreTitle');
        const winCount = document.getElementById('winCount');
        const lossCount = document.getElementById('lossCount');

        const eventSourceUrl = token ? `/widget_events?token=${encodeURIComponent(token)}` : '/widget_events';

        function updateDisplay(wins, losses, titleText) {
            if (titleText) {
                scoreTitle.textContent = titleText;
            } else if (!scoreTitle.textContent) {
                scoreTitle.textContent = lang === 'en' ? 'WIN / LOSS RECORD' : 'RÉCORD V / D';
            }

            winCount.textContent = `${wins} W`;
            lossCount.textContent = `${losses} L`;

            scoreBadge.classList.remove('bump');
            void scoreBadge.offsetWidth;
            scoreBadge.classList.add('bump');
        }

        function connectSSE() {
            const evtSource = new EventSource(eventSourceUrl);

            evtSource.onmessage = function(e) {
                try {
                    const data = JSON.parse(e.data);
                    if (data.event === 'score') {
                        updateDisplay(data.wins || 0, data.losses || 0, data.title_text);
                    } else if (data.event === 'initial_state' && data.widgets && data.widgets.score) {
                        const s = data.widgets.score.config || {};
                        updateDisplay(s.wins || 0, s.losses || 0);
                    }
                } catch (err) {
                    console.error("Error parsing score event:", err);
                }
            };

            evtSource.onerror = function() {
                evtSource.close();
                setTimeout(connectSSE, 3000);
            };
        }

        connectSSE();
    </script>
</body>
</html>
