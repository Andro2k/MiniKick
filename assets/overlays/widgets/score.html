<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniKick - Score Record OBS Overlay</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        body {
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        .score-capsule {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            min-width: 170px;
            border-radius: 20px;
            overflow: hidden;
            background: rgba(15, 19, 26, 0.94);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.38);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .score-capsule.bump {
            animation: pulse-bump 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pulse-bump {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .capsule-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 7px 18px;
            background: rgba(255, 215, 0, 0.12);
            border-bottom: 1px solid rgba(255, 215, 0, 0.18);
        }

        .trophy-svg {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
            display: block;
        }

        .score-title {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.4px;
            color: #ffd700;
        }

        .capsule-body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 22px;
        }

        .score-counts {
            font-size: 20px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 8px;
            line-height: 1;
        }

        .win-tag {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #2ed573;
        }

        .loss-tag {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #ff4757;
        }

        .score-divider {
            color: #484f58;
            font-size: 16px;
            font-weight: 700;
        }

        .stat-icon {
            width: 14px;
            height: 14px;
        }
    </style>
</head>
<body>

    <div class="score-capsule" id="scoreBadge">
        <div class="capsule-header">
            <svg class="trophy-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 5H17V3H7V5H5C3.9 5 3 5.9 3 7V9C3 11.21 4.79 13 7 13H7.54C8.28 14.79 10.03 16 12 16C13.97 16 15.72 14.79 16.46 13H17C19.21 13 21 11.21 21 9V7C21 5.9 20.1 5 19 5ZM5 9V7H7V9H5ZM19 9H17V7H19V9ZM10 18H14V20H10V18ZM8 21H16V22H8V21Z" fill="url(#trophy-grad)"/>
                <defs>
                    <linearGradient id="trophy-grad" x1="3" y1="3" x2="21" y2="22" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#ffd700"/>
                        <stop offset="100%" stop-color="#ffaa00"/>
                    </linearGradient>
                </defs>
            </svg>
            <span class="score-title" id="scoreTitle">RÉCORD V / D</span>
        </div>
        <div class="capsule-body">
            <div class="score-counts">
                <span class="win-tag">
                    <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="#2ed573" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    <span id="winCount">0 W</span>
                </span>
                <span class="score-divider">-</span>
                <span class="loss-tag">
                    <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="#ff4757" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                    <span id="lossCount">0 L</span>
                </span>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token') || '';
        const lang = (params.get('lang') || 'es').toLowerCase();
        const port = window.location.port || '8099';

        const scoreBadge = document.getElementById('scoreBadge');
        const scoreTitle = document.getElementById('scoreTitle');
        const winCount = document.getElementById('winCount');
        const lossCount = document.getElementById('lossCount');

        const eventSourceUrl = token ? `/widget_events?token=${encodeURIComponent(token)}` : '/widget_events';

        function setWidgetActive(isActive) {
            const badge = document.getElementById('scoreBadge');
            if (badge) {
                badge.style.display = isActive ? 'flex' : 'none';
            }
        }

        function updateDisplay(wins, losses, titleText, isActive) {
            if (isActive !== undefined) {
                setWidgetActive(isActive !== false);
            }
            if (titleText) {
                scoreTitle.textContent = titleText;
            } else if (!scoreTitle.textContent) {
                scoreTitle.textContent = lang === 'en' ? 'WIN / LOSS RECORD' : 'RÉCORD V / D';
            }

            winCount.textContent = `${wins} W`;
            lossCount.textContent = `${losses} L`;

            scoreBadge.classList.remove('bump');
            void scoreBadge.offsetWidth;
            scoreBadge.classList.add('bump');
        }

        let ws = null;
        let reconnectTimer = null;
        let heartbeatTimer = null;

        function connectWS() {
            if (ws) {
                try { ws.close(); } catch (e) {}
                ws = null;
            }

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws?topic=widgets&token=${encodeURIComponent(token || '')}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = function () {
                console.log("[Score Overlay] WebSocket conectado.");
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }
                heartbeatTimer = setInterval(() => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'ping' }));
                    }
                }, 15000);
            };

            ws.onmessage = function (e) {
                try {
                    const data = JSON.parse(e.data);
                    if (data.type === 'pong') return;
                    if (data.event === 'score') {
                        updateDisplay(data.wins || 0, data.losses || 0, data.title_text, data.is_active);
                    } else if (data.event === 'widget_toggle' && data.widget_id === 'score') {
                        setWidgetActive(data.is_active !== false);
                    } else if (data.event === 'initial_state' && data.widgets && data.widgets.score) {
                        const s = data.widgets.score.config || {};
                        updateDisplay(s.wins || 0, s.losses || 0, null, data.widgets.score.is_active);
                    }
                } catch (err) {
                    console.error("Error parsing score event:", err);
                }
            };

            ws.onerror = function () {
                cleanup();
                scheduleReconnect();
            };

            ws.onclose = function () {
                cleanup();
                scheduleReconnect();
            };
        }

        function cleanup() {
            if (heartbeatTimer) {
                clearInterval(heartbeatTimer);
                heartbeatTimer = null;
            }
        }

        function scheduleReconnect() {
            if (reconnectTimer) clearTimeout(reconnectTimer);
            reconnectTimer = setTimeout(() => {
                reconnectTimer = null;
                connectWS();
            }, 3000);
        }

        connectWS();
    </script>
</body>
</html>
