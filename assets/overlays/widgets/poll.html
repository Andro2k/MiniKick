<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiniKick - Live Poll OBS Overlay (Neutral)</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap");

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: transparent !important;
            overflow: hidden;
            font-family:
                "Plus Jakarta Sans",
                system-ui,
                -apple-system,
                sans-serif;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        *,
        *::before,
        *::after {
            box-sizing: inherit;
        }

        #poll-container {
            width: 100%;
            height: 100%;
            padding: 8px;
            display: flex;
            opacity: 0;
            transform: translateY(-20px) scale(0.95);
            transition:
                opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        #poll-container.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .poll-card {
            width: 100%;
            height: 100%;
            background: rgba(24, 24, 27, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            color: #ffffff;
            overflow: hidden;
            transition: border-color 0.4s ease;
            zoom: 1.2;
        }

        .poll-card.finished {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .poll-header {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition:
                background 0.4s ease,
                border-color 0.4s ease;
        }

        .poll-card.finished .poll-header {
            background: rgba(255, 255, 255, 0.03);
        }

        .poll-badge {
            font-size: 11px;
            font-weight: 800;
            color: #a1a1aa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color 0.4s ease;
        }

        .poll-card.finished .poll-badge {
            color: #e4e4e7;
        }

        .poll-question {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.3;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 12px;
            flex: 1;
            overflow-y: hidden;
        }

        .option-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 10px 12px;
            border-radius: 8px;
            background: transparent;
            transition: background 0.2s ease;
        }

        .option-item:nth-child(odd) {
            background: rgba(255, 255, 255, 0.02);
        }

        .option-item.winner {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: none;
            box-shadow: none;
        }

        .option-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
        }

        .option-label-container {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
        }

        .winner-tag {
            font-size: 9px;
            font-weight: 800;
            background: #ffffff;
            color: #18181b;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }

        .option-label {
            color: #e4e4e7;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 200px;
        }

        .option-votes {
            color: #a1a1aa;
            font-size: 14px;
            font-weight: 600;
        }

        .option-item.winner .option-label,
        .option-item.winner .option-votes {
            color: #ffffff;
            font-weight: 700;
        }

        .bar-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            background: #a1a1aa;
            border-radius: 2px;
            width: 0%;
            transition:
                width 0.6s ease,
                background 0.4s ease;
        }

        .option-item.winner .bar-fill {
            background: #ffffff;
        }

        .poll-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 600;
            color: #71717a;
            padding: 10px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(0, 0, 0, 0.1);
        }

        .timer-badge {
            color: #d4d4d8;
            font-weight: 700;
            transition: color 0.4s ease;
        }

        .poll-card.finished .timer-badge {
            color: #ffffff;
        }
    </style>
</head>

<body>
    <div id="poll-container">
        <div id="poll-card" class="poll-card">
            <div class="poll-header">
                <span id="poll-badge-text" class="poll-badge">ENCUESTA EN VIVO</span>
                <span id="poll-question" class="poll-question">--</span>
            </div>

            <div id="options-list" class="options-list"></div>

            <div class="poll-footer">
                <span id="poll-timer" class="timer-badge">--</span>
                <span id="poll-total-votes">0 votos</span>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get("token");
        const lang = (urlParams.get("lang") || "es").toLowerCase();
        const isPreview =
            urlParams.get("preview") === "true" ||
            urlParams.get("preview") === "1" ||
            window.location.protocol === "file:";

        const pollContainer = document.getElementById("poll-container");
        const pollCard = document.getElementById("poll-card");
        const pollBadgeText = document.getElementById("poll-badge-text");
        const pollQuestion = document.getElementById("poll-question");
        const optionsList = document.getElementById("options-list");
        const pollTimer = document.getElementById("poll-timer");
        const pollTotalVotes = document.getElementById("poll-total-votes");

        let ws = null;
        let reconnectTimer = null;
        let heartbeatTimer = null;
        let countdownInterval = null;

        let currentPollState = null;
        let remainingSeconds = 0;
        let resultDisplaySeconds = 15;
        let isResultPhase = false;

        function connectWS() {
            if (ws) {
                try {
                    ws.close();
                } catch (e) { }
                ws = null;
            }

            const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            const wsUrl = `${protocol}//${window.location.host}/ws?topic=widgets&token=${encodeURIComponent(token || "")}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = function () {
                console.log("[Poll Overlay] WebSocket conectado.");
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }
                heartbeatTimer = setInterval(() => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: "ping" }));
                    }
                }, 15000);
            };

            ws.onmessage = function (e) {
                try {
                    const data = JSON.parse(e.data);
                    if (data.type === "pong") return;
                    if (data.event === "poll_update") {
                        handlePollUpdate(data.poll || data);
                    } else if (data.event === "poll_delete") {
                        hidePoll();
                    } else if (
                        data.event === "widget_toggle" &&
                        data.widget_id === "poll"
                    ) {
                        if (data.is_active === false) {
                            hidePoll();
                        }
                    }
                } catch (err) {
                    console.error("Error al procesar evento de encuesta:", err);
                }
            };

            ws.onerror = function () {
                cleanup();
                scheduleReconnect();
            };

            ws.onclose = function () {
                cleanup();
                scheduleReconnect();
            };
        }

        function cleanup() {
            if (heartbeatTimer) {
                clearInterval(heartbeatTimer);
                heartbeatTimer = null;
            }
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
        }

        function scheduleReconnect() {
            if (reconnectTimer) clearTimeout(reconnectTimer);
            reconnectTimer = setTimeout(() => {
                reconnectTimer = null;
                connectWS();
            }, 3000);
        }

        function handlePollUpdate(poll) {
            if (!poll || !poll.title) {
                hidePoll();
                return;
            }

            const isSamePoll =
                currentPollState &&
                ((poll.id !== undefined &&
                    currentPollState.id !== undefined &&
                    poll.id === currentPollState.id) ||
                    (poll.title &&
                        currentPollState.title &&
                        poll.title === currentPollState.title));

            if (isSamePoll && currentPollState.options && poll.options) {
                const existingVoteMap = new Map();
                currentPollState.options.forEach((opt, idx) => {
                    const key =
                        opt.id !== undefined ? String(opt.id) : opt.label || String(idx);
                    existingVoteMap.set(key, opt.votes || 0);
                });
                poll.options.forEach((opt, idx) => {
                    const key =
                        opt.id !== undefined ? String(opt.id) : opt.label || String(idx);
                    const prevVotes = existingVoteMap.get(key) || 0;
                    opt.votes = Math.max(prevVotes, opt.votes || 0);
                });
            } else if (!isSamePoll) {
                isResultPhase = false;
                if (countdownInterval) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                }
            }

            currentPollState = poll;

            if (typeof poll.remaining === "number") {
                remainingSeconds = Math.max(0, poll.remaining);
            } else if (!isSamePoll || remainingSeconds <= 0) {
                remainingSeconds = poll.duration || 30;
            }

            resultDisplaySeconds =
                typeof poll.result_display_duration === "number"
                    ? poll.result_display_duration
                    : resultDisplaySeconds > 0
                        ? resultDisplaySeconds
                        : 15;

            isResultPhase = remainingSeconds <= 0;

            startTimerLoop();
            renderUI();
        }

        function startTimerLoop() {
            if (countdownInterval) return;

            countdownInterval = setInterval(() => {
                if (!isResultPhase) {
                    remainingSeconds--;
                    if (remainingSeconds <= 0) {
                        remainingSeconds = 0;
                        isResultPhase = true;
                    }
                } else {
                    resultDisplaySeconds--;
                    if (resultDisplaySeconds <= 0) {
                        cleanup();
                        hidePoll();
                        return;
                    }
                }
                renderUI();
            }, 1000);
        }

        function renderUI() {
            if (!currentPollState) return;

            pollQuestion.textContent = currentPollState.title || "";
            const options = currentPollState.options || [];
            const totalVotes = options.reduce(
                (sum, opt) => sum + (opt.votes || 0),
                0,
            );

            let maxVotes = 0;
            options.forEach((opt) => {
                const v = opt.votes || 0;
                if (v > maxVotes) maxVotes = v;
            });

            const topOptions =
                maxVotes > 0
                    ? options.filter((opt) => (opt.votes || 0) === maxVotes)
                    : [];
            const isTie = isResultPhase && topOptions.length > 1;
            const singleWinner =
                isResultPhase && topOptions.length === 1 ? topOptions[0] : null;

            if (isResultPhase) {
                pollCard.classList.add("finished");
                if (isTie) {
                    pollBadgeText.textContent =
                        lang === "en" ? "FINAL RESULT - TIE" : "RESULTADO FINAL - EMPATE";
                } else if (singleWinner) {
                    pollBadgeText.textContent =
                        lang === "en" ? "FINAL RESULT" : "RESULTADO FINAL";
                } else {
                    pollBadgeText.textContent =
                        lang === "en" ? "FINAL RESULT" : "RESULTADO FINAL";
                }
                pollTimer.textContent =
                    lang === "en"
                        ? `Closing in ${resultDisplaySeconds}s`
                        : `Cerrando en ${resultDisplaySeconds}s`;
            } else {
                pollCard.classList.remove("finished");
                pollBadgeText.textContent =
                    lang === "en" ? "LIVE POLL" : "ENCUESTA EN VIVO";
                pollTimer.textContent =
                    lang === "en"
                        ? `Time: ${remainingSeconds}s`
                        : `Tiempo: ${remainingSeconds}s`;
            }

            pollTotalVotes.textContent =
                lang === "en" ? `${totalVotes} votes` : `${totalVotes} votos`;

            optionsList.innerHTML = "";
            options.forEach((opt) => {
                const votes = opt.votes || 0;
                const percent =
                    totalVotes > 0 ? ((votes / totalVotes) * 100).toFixed(1) : "0.0";
                const isWinner =
                    singleWinner &&
                    (opt === singleWinner ||
                        (opt.id !== undefined && opt.id === singleWinner.id));

                const optItem = document.createElement("div");
                optItem.className = `option-item ${isWinner ? "winner" : ""}`;

                const winnerBadge = isWinner
                    ? `<span class="winner-tag">${lang === "en" ? "WINNER" : "GANADOR"}</span>`
                    : "";

                optItem.innerHTML = `
                    <div class="option-meta">
                        <div class="option-label-container">
                            ${winnerBadge}
                            <span class="option-label">${escapeHtml(opt.label || "")}</span>
                        </div>
                        <span class="option-votes">${votes} (${percent}%)</span>
                    </div>
                    <div class="bar-track">
                        <div class="bar-fill" style="width: ${percent}%"></div>
                    </div>
                `;
                optionsList.appendChild(optItem);
            });

            pollContainer.classList.add("visible");
        }

        function hidePoll() {
            pollContainer.classList.remove("visible");
            currentPollState = null;
            remainingSeconds = 0;
            isResultPhase = false;
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        if (isPreview) {
            handlePollUpdate({
                id: "preview_poll",
                title:
                    lang === "en"
                        ? "Live Poll Preview: Favorite Game?"
                        : "Encuesta en Vivo: ¿Cuál es tu juego favorito?",
                duration: 60,
                remaining: 45,
                options: [
                    { id: 1, label: "Minecraft", votes: 45 },
                    { id: 2, label: "Valorant", votes: 22 },
                    { id: 3, label: "League of Legends", votes: 18 },
                ],
            });
        }

        if (window.location.protocol !== "file:") {
            connectWS();
        }
    </script>
</body>
</html>
