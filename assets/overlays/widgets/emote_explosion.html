<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniKick - Animated Emote Explosion OBS Overlay (Canvas 2D Optimized)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: true });
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        let particles = [];
        const MAX_ACTIVE_PARTICLES = 250;
        let screenWidth = window.innerWidth;
        let screenHeight = window.innerHeight;

        function resizeCanvas() {
            screenWidth = window.innerWidth;
            screenHeight = window.innerHeight;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = screenWidth * dpr;
            canvas.height = screenHeight * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const imageCache = new Map();

        function getCachedImage(src) {
            if (!src) return null;
            if (imageCache.has(src)) {
                return imageCache.get(src);
            }
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = src;
            imageCache.set(src, img);
            return img;
        }

        class CanvasParticle {
            constructor(emote) {
                this.type = emote.type || 'text';
                this.src = emote.src || emote.name || '🔥';
                this.name = emote.name || 'Emote';

                this.img = (this.type === 'image' && this.src) ? getCachedImage(this.src) : null;

                this.size = 52 + Math.floor(Math.random() * 36);

                this.x = screenWidth / 2 + (Math.random() - 0.5) * (screenWidth * 0.4);
                this.y = screenHeight - 60;

                this.vx = (Math.random() - 0.5) * 18;
                this.vy = - (14 + Math.random() * 16);
                this.gravity = 0.45;
                this.bounce = 0.65;
                this.friction = 0.985;

                this.rotation = (Math.random() - 0.5) * 0.4;
                this.vRot = (Math.random() - 0.5) * 0.12;

                this.alpha = 1.0;
                this.decay = 0.008 + Math.random() * 0.006;
                this.life = 0;
            }

            update() {
                this.vy += this.gravity;
                this.vx *= this.friction;
                this.vy *= this.friction;

                this.x += this.vx;
                this.y += this.vy;
                this.rotation += this.vRot;

                if (this.x < 0) {
                    this.x = 0;
                    this.vx = -this.vx * this.bounce;
                } else if (this.x + this.size > screenWidth) {
                    this.x = screenWidth - this.size;
                    this.vx = -this.vx * this.bounce;
                }

                if (this.y + this.size > screenHeight) {
                    this.y = screenHeight - this.size;
                    this.vy = -this.vy * this.bounce;
                    this.vx *= 0.8;
                }

                this.life += 1;
                if (this.life > 90) {
                    this.alpha -= this.decay;
                }
            }

            draw(ctx) {
                if (this.alpha <= 0) return;

                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.translate(this.x + this.size / 2, this.y + this.size / 2);
                ctx.rotate(this.rotation);

                if (this.type === 'image' && this.img && this.img.complete && this.img.naturalWidth > 0) {
                    ctx.drawImage(this.img, -this.size / 2, -this.size / 2, this.size, this.size);
                } else {
                    ctx.font = `900 ${Math.floor(this.size * 0.85)}px 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = '#FFFFFF';
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
                    ctx.shadowBlur = 8;
                    ctx.fillText(this.src, 0, 0);
                }

                ctx.restore();
            }
        }

        function triggerExplosion(emotesList, count = 25) {
            if (!emotesList || emotesList.length === 0) {
                emotesList = [
                    { type: 'text', src: '🔥', name: '🔥' },
                    { type: 'text', src: '⚡', name: '⚡' },
                    { type: 'text', src: '🎉', name: '🎉' }
                ];
            }

            const actualCount = Math.min(count, 150);

            for (let i = 0; i < actualCount; i++) {
                if (particles.length >= MAX_ACTIVE_PARTICLES) {
                    particles.shift();
                }
                const randomEmote = emotesList[Math.floor(Math.random() * emotesList.length)];
                particles.push(new CanvasParticle(randomEmote));
            }
        }

        function animationLoop() {
            ctx.clearRect(0, 0, screenWidth, screenHeight);

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw(ctx);

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
            requestAnimationFrame(animationLoop);
        }
        requestAnimationFrame(animationLoop);

        let ws = null;
        let heartbeatTimer = null;
        let reconnectTimer = null;

        function connectWS() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws?topic=widgets&token=${encodeURIComponent(token || '')}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = function () {
                console.log("[Animated Emote Explosion Canvas Overlay] WebSocket conectado.");
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }
                heartbeatTimer = setInterval(() => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'ping' }));
                    }
                }, 15000);
            };

            ws.onmessage = function (e) {
                try {
                    const data = JSON.parse(e.data);
                    if (data.type === 'pong') return;

                    if (data.event === 'emote_explosion') {
                        triggerExplosion(data.emotes, data.count || 25);
                    }
                } catch (err) {
                    console.error("Error parsing emote explosion event:", err);
                }
            };

            ws.onerror = function () {
                cleanup();
                scheduleReconnect();
            };

            ws.onclose = function () {
                cleanup();
                scheduleReconnect();
            };
        }

        function cleanup() {
            if (heartbeatTimer) {
                clearInterval(heartbeatTimer);
                heartbeatTimer = null;
            }
        }

        function scheduleReconnect() {
            if (!reconnectTimer) {
                reconnectTimer = setTimeout(() => {
                    connectWS();
                }, 3000);
            }
        }

        connectWS();
    </script>
</body>

</html>
