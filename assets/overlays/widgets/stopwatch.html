<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniKick - Stopwatch OBS Overlay (Neutral)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap');

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: transparent !important;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        *,
        *::before,
        *::after {
            box-sizing: inherit;
        }

        #stopwatch-container {
            width: 100%;
            height: 100%;
            padding: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transform: translateY(12px) scale(0.96);
            transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        #stopwatch-container.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .stopwatch-card {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            min-width: 220px;
            background: rgba(24, 24, 27, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            overflow: hidden;
            color: #ffffff;
            zoom: 1.5;
        }

        .stopwatch-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 11px;
            font-weight: 800;
            color: #a1a1aa;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        .stopwatch-state {
            color: #e4e4e7;
            display: none;
        }

        .stopwatch-card.paused .stopwatch-state {
            display: inline;
        }

        .stopwatch-body {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 4px;
            padding: 14px 24px;
            font-variant-numeric: tabular-nums;
        }

        .stopwatch-time {
            font-size: 52px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: 1px;
        }

        .stopwatch-centis {
            font-size: 20px;
            font-weight: 800;
            color: #a1a1aa;
            min-width: 1.6em;
        }

        .stopwatch-card.paused .stopwatch-time {
            color: #a1a1aa;
        }
    </style>
</head>

<body>
    <div id="stopwatch-container">
        <div id="stopwatch-card" class="stopwatch-card">
            <div class="stopwatch-header">
                <span id="stopwatch-label">CRONÓMETRO</span>
                <span id="stopwatch-state" class="stopwatch-state">PAUSADO</span>
            </div>
            <div class="stopwatch-body">
                <span id="stopwatch-time" class="stopwatch-time">00:00</span>
                <span id="stopwatch-centis" class="stopwatch-centis">.00</span>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const lang = (urlParams.get('lang') || 'es').toLowerCase();
        const isPreview = urlParams.get('preview') === 'true' || urlParams.get('preview') === '1' || window.location.protocol === 'file:';
        const showCentis = urlParams.get('centis') !== 'false';
        const WIDGET_ID = 'stopwatch';

        const TEXTS = lang === 'en'
            ? { label: 'STOPWATCH', paused: 'PAUSED' }
            : { label: 'CRONÓMETRO', paused: 'PAUSADO' };

        const container = document.getElementById('stopwatch-container');
        const card = document.getElementById('stopwatch-card');
        const labelEl = document.getElementById('stopwatch-label');
        const stateEl = document.getElementById('stopwatch-state');
        const timeEl = document.getElementById('stopwatch-time');
        const centisEl = document.getElementById('stopwatch-centis');

        labelEl.textContent = TEXTS.label;
        stateEl.textContent = TEXTS.paused;
        centisEl.style.display = showCentis ? '' : 'none';

        let widgetActive = true;
        let hasContent = false;
        let status = 'stopped';
        let baseElapsedMs = 0;
        let anchor = 0;
        let rafId = null;

        const pad = (n) => String(n).padStart(2, '0');

        function elapsedMs() {
            if (status !== 'running') return baseElapsedMs;
            return baseElapsedMs + (performance.now() - anchor);
        }

        function render() {
            const ms = elapsedMs();
            const totalSec = Math.floor(ms / 1000);
            const h = Math.floor(totalSec / 3600);
            const m = Math.floor((totalSec % 3600) / 60);
            const s = totalSec % 60;
            timeEl.textContent = h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
            if (showCentis) {
                centisEl.textContent = `.${pad(Math.floor((ms % 1000) / 10))}`;
            }
        }

        function loop() {
            render();
            rafId = status === 'running' ? requestAnimationFrame(loop) : null;
        }

        function syncVisibility() {
            container.classList.toggle('visible', widgetActive && hasContent);
            card.classList.toggle('paused', status === 'paused');

            if (status === 'running' && rafId === null) {
                rafId = requestAnimationFrame(loop);
            }
        }

        function applyUpdate(data) {
            status = data.status || 'stopped';
            baseElapsedMs = Math.max(0, data.elapsed_ms || 0);
            anchor = performance.now();
            hasContent = status === 'running' || status === 'paused';
            render();
            syncVisibility();
        }

        let ws = null;
        let reconnectTimer = null;
        let heartbeatTimer = null;

        function connectWS() {
            if (ws) {
                try { ws.close(); } catch (e) { }
                ws = null;
            }

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws?topic=widgets&token=${encodeURIComponent(token || '')}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = function () {
                console.log('[Stopwatch Overlay] WebSocket conectado.');
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }
                heartbeatTimer = setInterval(() => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'ping' }));
                    }
                }, 15000);
            };

            ws.onmessage = function (e) {
                try {
                    const data = JSON.parse(e.data);
                    if (data.type === 'pong') return;
                    if (data.event === 'stopwatch_update') {
                        applyUpdate(data);
                    } else if (data.event === 'widget_toggle' && data.widget_id === WIDGET_ID) {
                        widgetActive = data.is_active !== false;
                        syncVisibility();
                    } else if (data.event === 'initial_state' && data.widgets && data.widgets[WIDGET_ID]) {
                        widgetActive = data.widgets[WIDGET_ID].is_active !== false;
                        syncVisibility();
                    }
                } catch (err) {
                    console.error('Error al procesar evento de cronómetro:', err);
                }
            };

            ws.onerror = function () {
                cleanup();
                scheduleReconnect();
            };

            ws.onclose = function () {
                cleanup();
                scheduleReconnect();
            };
        }

        function cleanup() {
            if (heartbeatTimer) {
                clearInterval(heartbeatTimer);
                heartbeatTimer = null;
            }
        }

        function scheduleReconnect() {
            if (reconnectTimer) clearTimeout(reconnectTimer);
            reconnectTimer = setTimeout(() => {
                reconnectTimer = null;
                connectWS();
            }, 3000);
        }

        if (isPreview) {
            applyUpdate({ status: 'running', elapsed_ms: 754000 });
        }

        if (window.location.protocol !== 'file:') {
            connectWS();
        }
    </script>
</body>
</html>
