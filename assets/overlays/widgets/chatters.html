<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiniKick - Top Chatters OBS Overlay (Neutral)</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap");

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: transparent !important;
            overflow: hidden;
            font-family:
                "Plus Jakarta Sans",
                system-ui,
                -apple-system,
                sans-serif;
            box-sizing: border-box;
        }

        *,
        *::before,
        *::after {
            box-sizing: inherit;
        }

        #chatters-container {
            width: 100%;
            height: 100%;
            padding: 8px;
            display: flex;
            opacity: 1;
            transition: opacity 0.4s ease;
        }

        #chatters-container.hidden {
            opacity: 0;
        }

        .chatters-card {
            width: 100%;
            height: 100%;
            background: rgba(24, 24, 27, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            color: #ffffff;
            overflow: hidden;
            zoom: 1.2;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header-title {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .header-subtitle {
            font-size: 12px;
            font-weight: 600;
            color: #a1a1a1;
        }

        .ranking-list {
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 6px;
            flex: 1;
            overflow-y: hidden;
        }

        .chatter-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 8px;
            background: transparent;
            transition: background 0.2s ease;
        }

        .chatter-item:nth-child(odd) {
            background: rgba(255, 255, 255, 0.02);
        }

        .user-col {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }

        .rank-badge {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            font-weight: 800;
            flex-shrink: 0;
        }

        .rank-1 .rank-badge {
            background: #ffffff;
            color: #18181b;
        }

        .rank-2 .rank-badge {
            background: #d8d8d8;
            color: #18181b;
        }

        .rank-3 .rank-badge {
            background: #a1a1a1;
            color: #18181b;
        }

        .rank-other .rank-badge {
            background: #3f3f3f;
            color: #d4d4d8;
        }

        .username {
            font-size: 14px;
            font-weight: 600;
            color: #e4e4e4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }

        .msg-count {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
        }

        .empty-placeholder {
            text-align: center;
            font-size: 12px;
            color: #717171;
            padding: 20px 0;
            font-style: italic;
        }
    </style>
</head>

<body>
    <div id="chatters-container">
        <div class="chatters-card">
            <div class="header-row">
                <span id="badge-tag" class="header-title">TOP CHATTERS</span>
                <span id="total-pill" class="header-subtitle">Este Mes</span>
            </div>

            <div id="ranking-list" class="ranking-list">
                <div id="empty-state" class="empty-placeholder">
                    Esperando mensajes...
                </div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get("token");
        const lang = (urlParams.get("lang") || "es").toLowerCase();
        const isPreview =
            urlParams.get("preview") === "true" ||
            urlParams.get("preview") === "1" ||
            window.location.protocol === "file:";

        const chattersContainer = document.getElementById("chatters-container");
        const badgeTag = document.getElementById("badge-tag");
        const totalPill = document.getElementById("total-pill");
        const rankingList = document.getElementById("ranking-list");
        const emptyState = document.getElementById("empty-state");

        if (lang === "en") {
            badgeTag.textContent = "TOP CHATTERS";
            totalPill.textContent = "This Month";
            emptyState.textContent = "Waiting for messages...";
        }

        let ws = null;
        let reconnectTimer = null;
        let heartbeatTimer = null;

        function connectWS() {
            if (ws) {
                try {
                    ws.close();
                } catch (e) { }
                ws = null;
            }

            const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            const wsUrl = `${protocol}//${window.location.host}/ws?topic=widgets&token=${encodeURIComponent(token || "")}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = function () {
                console.log("[Top Chatters Overlay] WebSocket conectado.");
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }
                heartbeatTimer = setInterval(() => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: "ping" }));
                    }
                }, 15000);
            };

            ws.onmessage = function (e) {
                try {
                    const data = JSON.parse(e.data);
                    if (data.type === "pong") return;
                    if (data.event === "top_chatters_update") {
                        renderTopChatters(data);
                    } else if (
                        data.event === "widget_toggle" &&
                        data.widget_id === "chatters"
                    ) {
                        if (data.is_active === false) {
                            chattersContainer.classList.add("hidden");
                        } else {
                            chattersContainer.classList.remove("hidden");
                        }
                    }
                } catch (err) {
                    console.error("Error al procesar evento de top chatters:", err);
                }
            };

            ws.onerror = function () {
                cleanup();
                scheduleReconnect();
            };

            ws.onclose = function () {
                cleanup();
                scheduleReconnect();
            };
        }

        function cleanup() {
            if (heartbeatTimer) {
                clearInterval(heartbeatTimer);
                heartbeatTimer = null;
            }
        }

        function scheduleReconnect() {
            if (reconnectTimer) clearTimeout(reconnectTimer);
            reconnectTimer = setTimeout(() => {
                reconnectTimer = null;
                connectWS();
            }, 3000);
        }

        function renderTopChatters(data) {
            if (!data) return;

            if (data.is_active === false) {
                chattersContainer.classList.add("hidden");
                return;
            } else {
                chattersContainer.classList.remove("hidden");
            }

            const top = data.top || [];

            totalPill.textContent = `${data.total_messages || 0} msgs`;

            if (top.length === 0) {
                rankingList.innerHTML = `<div class="empty-placeholder">${lang === "en" ? "Waiting for messages..." : "Esperando mensajes..."}</div>`;
                return;
            }

            rankingList.innerHTML = "";

            top.forEach((item, index) => {
                const rank = index + 1;
                const count = item.count || 0;

                const chatterRow = document.createElement("div");
                const rankClass = rank <= 3 ? `rank-${rank}` : "rank-other";
                chatterRow.className = `chatter-item ${rankClass}`;

                chatterRow.innerHTML = `
                    <div class="user-col">
                        <span class="rank-badge">${rank}</span>
                        <span class="username">${escapeHtml(item.user || "User")}</span>
                    </div>
                    <span class="msg-count">${count}</span>
                `;
                rankingList.appendChild(chatterRow);
            });
        }

        function escapeHtml(str) {
            if (!str) return "";
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        if (isPreview) {
            renderTopChatters({
                is_active: true,
                total_messages: 164,
                top: [
                    { user: "TheAndro2K", count: 54 },
                    { user: "UnAndroFake", count: 42 },
                    { user: "PixelGamer", count: 31 },
                    { user: "CyberWolf", count: 23 },
                    { user: "NeonValkyrie", count: 14 },
                ],
            });
        }

        if (window.location.protocol !== "file:") {
            connectWS();
        }
    </script>
</body>

</html>
