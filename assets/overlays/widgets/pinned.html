<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniKick - Pinned Message OBS Overlay (Neutral)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap');

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: transparent !important;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        *,
        *::before,
        *::after {
            box-sizing: inherit;
        }

        #pinned-container {
            width: 100%;
            height: 100%;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
            z-index: 1000;
            opacity: 0;
            transform: translateY(-24px) scale(0.95);
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        #pinned-container.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .pinned-card {
            width: 100%;
            max-width: 580px;
            background: rgba(24, 24, 27, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            overflow: hidden;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            zoom: 1.5;
        }

        .pinned-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge-tag {
            font-size: 11px;
            font-weight: 800;
            color: #e4e4e7;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        .author-name {
            font-size: 13px;
            font-weight: 800;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
            padding: 3px 10px;
            border-radius: 6px;
        }

        .pinned-body {
            padding: 16px 20px;
        }

        .pinned-text {
            font-size: 15px;
            font-weight: 600;
            color: #e4e4e7;
            line-height: 1.5;
            word-break: break-word;
        }
    </style>
</head>

<body>

    <div id="pinned-container">
        <div class="pinned-card">
            <div class="pinned-header">
                <div class="header-left">
                    <span id="badge-tag" class="badge-tag">MENSAJE FIJADO</span>
                </div>
                <span id="author-name" class="author-name">@Streamer</span>
            </div>
            <div class="pinned-body">
                <div id="pinned-text" class="pinned-text">--</div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const lang = (urlParams.get('lang') || 'es').toLowerCase();
        const isPreview = urlParams.get('preview') === 'true' || urlParams.get('preview') === '1' || window.location.protocol === 'file:';

        const pinnedContainer = document.getElementById('pinned-container');
        const badgeTag = document.getElementById('badge-tag');
        const authorName = document.getElementById('author-name');
        const pinnedText = document.getElementById('pinned-text');

        if (lang === 'en') {
            badgeTag.textContent = 'PINNED MESSAGE';
        }

        let ws = null;
        let reconnectTimer = null;

        function connectWS() {
            if (ws) {
                try { ws.close(); } catch (e) { }
                ws = null;
            }

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws?topic=widgets&token=${encodeURIComponent(token || '')}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = function () {
                console.log("[Pinned Overlay] WebSocket conectado.");
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }
            };

            ws.onmessage = function (e) {
                try {
                    const data = JSON.parse(e.data);
                    if (data.type === 'pong') return;
                    if (data.event === 'pinned_created') {
                        renderPinned(data.pinned || data);
                    } else if (data.event === 'pinned_deleted') {
                        hidePinned();
                    } else if (data.event === 'widget_toggle' && data.widget_id === 'pinned') {
                        if (data.is_active === false) {
                            hidePinned();
                        }
                    }
                } catch (err) {}
            };

            ws.onerror = function () {
                scheduleReconnect();
            };

            ws.onclose = function () {
                scheduleReconnect();
            };
        }

        function scheduleReconnect() {
            if (reconnectTimer) clearTimeout(reconnectTimer);
            reconnectTimer = setTimeout(() => {
                reconnectTimer = null;
                connectWS();
            }, 3000);
        }

        function renderPinned(pinned) {
            if (!pinned) {
                hidePinned();
                return;
            }

            let content = '';
            if (typeof pinned === 'string') {
                content = pinned;
            } else if (typeof pinned.content === 'string') {
                content = pinned.content;
            } else if (pinned.content && typeof pinned.content.content === 'string') {
                content = pinned.content.content;
            } else if (typeof pinned.message === 'string') {
                content = pinned.message;
            } else if (pinned.message && typeof pinned.message.content === 'string') {
                content = pinned.message.content;
            }

            if (!content || typeof content !== 'string') {
                hidePinned();
                return;
            }

            let sender = pinned.sender || {};
            if ((!sender || !sender.username) && pinned.message && typeof pinned.message === 'object') {
                sender = pinned.message.sender || sender;
            }

            const username = sender.username || sender.slug || '@Streamer';
            
            // Para el diseño neutro, forzamos el color del nombre a blanco o lo mantenemos sutil. 
            // Si quieres usar el color del usuario, descomenta la siguiente línea y borra la del color blanco.
            const userColor = sender.identity?.color || '#ffffff'; 
            // const userColor = '#ffffff';

            authorName.textContent = username.startsWith('@') ? username : `@${username}`;
            authorName.style.color = userColor;
            pinnedText.textContent = content;

            pinnedContainer.classList.add('visible');
        }

        function hidePinned() {
            pinnedContainer.classList.remove('visible');
        }

        if (isPreview) {
            renderPinned({
                sender: { username: 'TheAndro2K' },
                content: '¡Bienvenidos al stream! Hoy jugaremos Valorant con subs, dejen su ID en el chat. 🚀'
            });
        } else {
            connectWS();
        }
    </script>
</body>

</html>
