<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniKick - Pinned Message OBS Overlay</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        body {
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin: 0;
            padding: 20px;
        }

        #pinned-container {
            width: 100%;
            max-width: 580px;
            margin: auto;
            position: relative;
            z-index: 1000;
            opacity: 0;
            transform: translateY(-24px) scale(0.95);
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        #pinned-container.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .pinned-card {
            background: rgba(15, 19, 26, 0.94);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.38);
            border-radius: 20px;
            overflow: hidden;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        .pinned-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 9px 18px;
            background: rgba(255, 193, 7, 0.12);
            border-bottom: 1px solid rgba(255, 193, 7, 0.18);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .pin-svg {
            width: 15px;
            height: 15px;
            color: #ffc107;
            display: block;
            flex-shrink: 0;
        }

        .badge-tag {
            font-size: 11px;
            font-weight: 800;
            color: #ffc107;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        .author-name {
            font-size: 13px;
            font-weight: 800;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 8px;
            border-radius: 6px;
        }

        .pinned-body {
            padding: 14px 20px;
        }

        .pinned-text {
            font-size: 14px;
            font-weight: 600;
            color: #f0f6fc;
            line-height: 1.5;
            word-break: break-word;
        }
    </style>
</head>

<body>

    <div id="pinned-container">
        <div class="pinned-card">
            <div class="pinned-header">
                <div class="header-left">
                    <svg class="pin-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="17" x2="12" y2="22"></line>
                        <path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6a1 1 0 0 1 1-1 1.5 1.5 0 0 0 1.5-1.5V3a1 1 0 0 0-1-1H7.5a1 1 0 0 0-1 1v.5A1.5 1.5 0 0 0 8 5a1 1 0 0 1 1 1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17z"></path>
                    </svg>
                    <span id="badge-tag" class="badge-tag">MENSAJE FIJADO</span>
                </div>
                <span id="author-name" class="author-name">@Streamer</span>
            </div>
            <div class="pinned-body">
                <div id="pinned-text" class="pinned-text">--</div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const lang = (urlParams.get('lang') || 'es').toLowerCase();

        const pinnedContainer = document.getElementById('pinned-container');
        const badgeTag = document.getElementById('badge-tag');
        const authorName = document.getElementById('author-name');
        const pinnedText = document.getElementById('pinned-text');

        if (lang === 'en') {
            badgeTag.textContent = 'PINNED MESSAGE';
        }

        let ws = null;
        let reconnectTimer = null;

        function connectWS() {
            if (ws) {
                try { ws.close(); } catch (e) { }
                ws = null;
            }

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws?topic=widgets&token=${encodeURIComponent(token || '')}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = function () {
                console.log("[Pinned Overlay] WebSocket conectado.");
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }
            };

            ws.onmessage = function (e) {
                try {
                    const data = JSON.parse(e.data);
                    if (data.type === 'pong') return;
                    if (data.event === 'pinned_created') {
                        renderPinned(data.pinned || data);
                    } else if (data.event === 'pinned_deleted') {
                        hidePinned();
                    } else if (data.event === 'widget_toggle' && data.widget_id === 'pinned') {
                        if (data.is_active === false) {
                            hidePinned();
                        }
                    }
                } catch (err) {
                    console.error("Error al procesar evento mensaje fijado:", err);
                }
            };

            ws.onerror = function () {
                scheduleReconnect();
            };

            ws.onclose = function () {
                scheduleReconnect();
            };
        }

        function scheduleReconnect() {
            if (reconnectTimer) clearTimeout(reconnectTimer);
            reconnectTimer = setTimeout(() => {
                reconnectTimer = null;
                connectWS();
            }, 3000);
        }

        function renderPinned(pinned) {
            if (!pinned) {
                hidePinned();
                return;
            }

            let content = '';
            if (typeof pinned === 'string') {
                content = pinned;
            } else if (typeof pinned.content === 'string') {
                content = pinned.content;
            } else if (pinned.content && typeof pinned.content.content === 'string') {
                content = pinned.content.content;
            } else if (typeof pinned.message === 'string') {
                content = pinned.message;
            } else if (pinned.message && typeof pinned.message.content === 'string') {
                content = pinned.message.content;
            }

            if (!content || typeof content !== 'string') {
                hidePinned();
                return;
            }

            let sender = pinned.sender || {};
            if ((!sender || !sender.username) && pinned.message && typeof pinned.message === 'object') {
                sender = pinned.message.sender || sender;
            }

            const username = sender.username || sender.slug || '@Streamer';
            const identity = sender.identity || {};
            const userColor = identity.color || '#ffc107';

            authorName.textContent = username.startsWith('@') ? username : `@${username}`;
            authorName.style.color = userColor;
            pinnedText.textContent = content;

            pinnedContainer.classList.add('visible');
        }

        function hidePinned() {
            pinnedContainer.classList.remove('visible');
        }

        connectWS();
    </script>
</body>

</html>
