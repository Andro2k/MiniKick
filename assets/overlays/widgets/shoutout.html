<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniKick - Shoutout OBS Overlay</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #shoutout-container {
            position: relative;
            z-index: 1000;
            perspective: 1000px;
        }

        .so-card {
            min-width: 340px;
            max-width: 420px;
            background: rgba(15, 19, 26, 0.94);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.38);
            border-radius: 20px;
            overflow: hidden;
            color: #ffffff;
            opacity: 0;
            transform: translateY(40px) scale(0.95);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        .so-card.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .so-header-bar {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 8px 18px;
            background: rgba(83, 252, 24, 0.1);
            border-bottom: 1px solid rgba(83, 252, 24, 0.15);
            font-size: 11px;
            font-weight: 800;
            color: #53fc18;
            text-transform: uppercase;
            letter-spacing: 1.3px;
        }

        .so-body {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 20px;
        }

        .so-avatar-wrapper {
            position: relative;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.15);
            overflow: hidden;
            background: #1e293b;
            flex-shrink: 0;
        }

        .so-avatar-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .so-badge {
            position: absolute;
            bottom: -2px;
            right: -2px;
            background: #53fc18;
            color: #000;
            font-size: 9px;
            font-weight: 900;
            padding: 1px 5px;
            border-radius: 6px;
            text-transform: uppercase;
        }

        .so-content {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }

        .so-username {
            font-size: 20px;
            font-weight: 900;
            color: #ffffff;
            line-height: 1.1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .so-url {
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div id="shoutout-container">
        <div id="so-card" class="so-card">
            <div id="so-header" class="so-header-bar">Streamer Recomendado</div>
            <div class="so-body">
                <div class="so-avatar-wrapper">
                    <img id="so-avatar" src="https://kick.com/favicon.ico" alt="Avatar">
                    <div class="so-badge">LIVE</div>
                </div>
                <div class="so-content">
                    <div id="so-username" class="so-username">Streamer</div>
                    <div id="so-url" class="so-url">kick.com/streamer</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const lang = (urlParams.get('lang') || 'es').toLowerCase();
        const eventSourceUrl = token ? `/widget_events?token=${encodeURIComponent(token)}` : '/widget_events';

        const soCard = document.getElementById('so-card');
        const soAvatar = document.getElementById('so-avatar');
        const soHeader = document.getElementById('so-header');
        const soUsername = document.getElementById('so-username');
        const soUrl = document.getElementById('so-url');

        let soTimeout = null;

        if (lang === 'en') {
            soHeader.textContent = 'Recommended Streamer';
        }

        let ws = null;
        let reconnectTimer = null;
        let heartbeatTimer = null;

        function connectWS() {
            if (ws) {
                try { ws.close(); } catch (e) {}
                ws = null;
            }

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws?topic=widgets&token=${encodeURIComponent(token || '')}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = function () {
                console.log("[Shoutout Overlay] WebSocket conectado.");
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }
                heartbeatTimer = setInterval(() => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'ping' }));
                    }
                }, 15000);
            };

            ws.onmessage = function (e) {
                try {
                    const data = JSON.parse(e.data);
                    if (data.type === 'pong') return;
                    if (data.event === 'shoutout') {
                        showShoutout(data);
                    }
                } catch (err) {
                    console.error("Error parsing shoutout event:", err);
                }
            };

            ws.onerror = function () {
                cleanup();
                scheduleReconnect();
            };

            ws.onclose = function () {
                cleanup();
                scheduleReconnect();
            };
        }

        function cleanup() {
            if (heartbeatTimer) {
                clearInterval(heartbeatTimer);
                heartbeatTimer = null;
            }
        }

        function scheduleReconnect() {
            if (reconnectTimer) clearTimeout(reconnectTimer);
            reconnectTimer = setTimeout(() => {
                reconnectTimer = null;
                connectWS();
            }, 3000);
        }

        function showShoutout(data) {
            const target = data.target || 'Streamer';
            const channelUrl = data.url || `https://kick.com/${target}`;
            const avatar = data.avatar_url || `https://kick.com/favicon.ico`;
            const headerText = data.header_text || (lang === 'en' ? 'Recommended Streamer' : 'Streamer Recomendado');

            soHeader.textContent = headerText;
            soUsername.textContent = `@${target}`;
            soUrl.textContent = channelUrl.replace('https://', '');
            soAvatar.src = avatar;

            soCard.classList.add('active');

            if (soTimeout) clearTimeout(soTimeout);
            soTimeout = setTimeout(() => {
                soCard.classList.remove('active');
            }, 8000);
        }

        connectWS();
    </script>
</body>
</html>
