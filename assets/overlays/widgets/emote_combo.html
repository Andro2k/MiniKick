<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniKick - Emote Combo OBS Overlay</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        body,
        html {
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #combo-container {
            position: relative;
            z-index: 1000;
            opacity: 0;
            transform: translateY(20px) scale(0.9);
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #combo-container.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .combo-card {
            position: relative;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 28px;
            background: rgba(13, 17, 23, 0.94);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 159, 26, 0.7);
            border-radius: 20px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7), 0 0 30px rgba(255, 159, 26, 0.4);
            color: #ffffff;
            overflow: hidden;
        }

        .fire-icon {
            font-size: 36px;
            line-height: 1;
            filter: drop-shadow(0 0 10px rgba(255, 159, 26, 0.8));
            animation: flame-pulse 0.6s ease-in-out infinite alternate;
        }

        @keyframes flame-pulse {
            0% {
                transform: scale(1) rotate(-5deg);
            }

            100% {
                transform: scale(1.15) rotate(5deg);
            }
        }

        .combo-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .combo-label {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #ff9f1a;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .emote-name {
            color: #ffffff;
            font-weight: 900;
        }

        .combo-count {
            font-size: 38px;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #fff 0%, #ff9f1a 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 159, 26, 0.5);
        }

        .timer-bar-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff9f1a, #ff3838);
            box-shadow: 0 0 10px rgba(255, 159, 26, 0.8);
            transition: width 0.1s linear;
        }

        .emote-img-display {
            width: 48px;
            height: 48px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(255, 159, 26, 0.8));
            animation: flame-pulse 0.6s ease-in-out infinite alternate;
        }

        .emoji-display {
            font-size: 38px;
            line-height: 1;
            filter: drop-shadow(0 0 10px rgba(255, 159, 26, 0.8));
            animation: flame-pulse 0.6s ease-in-out infinite alternate;
        }

        .bump {
            animation: combo-bump 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes combo-bump {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.25) rotate(-2deg);
                border-color: #ffffff;
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <div id="combo-container">
        <div class="combo-card" id="combo-card">
            <div class="fire-icon" id="fire-icon">🔥</div>
            <div class="combo-info">
                <div class="combo-label">
                    <span>COMBO DE EMOTES:</span>
                    <span class="emote-name" id="emote-name">KEKW</span>
                </div>
                <div class="combo-count" id="combo-count">x3</div>
            </div>
            <div class="timer-bar-container">
                <div class="timer-bar" id="timer-bar"></div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        const container = document.getElementById('combo-container');
        const card = document.getElementById('combo-card');
        const emoteNameEl = document.getElementById('emote-name');
        const comboCountEl = document.getElementById('combo-count');
        const timerBarEl = document.getElementById('timer-bar');

        let comboTimeoutSec = 5.0;
        let comboTimer = null;
        let timerInterval = null;
        let startTime = 0;

        function showCombo(data, count, timeoutSec = 5.0) {
            let emoteName = "KEKW";
            let emoteSrc = "";
            let emoteType = "text";

            if (typeof data === 'object' && data !== null) {
                emoteName = data.emote || "KEKW";
                emoteSrc = data.src || "";
                emoteType = data.type || "text";
                count = data.count !== undefined ? data.count : count;
                timeoutSec = data.timeout_sec !== undefined ? data.timeout_sec : timeoutSec;
            } else {
                emoteName = data;
            }

            comboTimeoutSec = timeoutSec;
            emoteNameEl.textContent = emoteName;
            comboCountEl.textContent = `x${count}`;

            const fireIconEl = document.getElementById('fire-icon');
            if (emoteType === 'image' && emoteSrc) {
                fireIconEl.innerHTML = `<img src="${emoteSrc}" class="emote-img-display" alt="${emoteName}">`;
            } else if (emoteType === 'text' && emoteSrc && emoteSrc !== emoteName) {
                fireIconEl.innerHTML = `<span class="emoji-display">${emoteSrc}</span>`;
            } else {
                fireIconEl.innerHTML = `🔥`;
            }

            container.classList.add('visible');

            card.classList.remove('bump');
            void card.offsetWidth;
            card.classList.add('bump');

            startTime = Date.now();
            if (timerInterval) clearInterval(timerInterval);
            if (comboTimer) clearTimeout(comboTimer);

            timerBarEl.style.width = '100%';

            timerInterval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                const remainingPct = Math.max(0, 100 * (1 - elapsed / comboTimeoutSec));
                timerBarEl.style.width = `${remainingPct}%`;

                if (remainingPct <= 0) {
                    clearInterval(timerInterval);
                }
            }, 50);

            comboTimer = setTimeout(() => {
                hideCombo();
            }, comboTimeoutSec * 1000);
        }

        function hideCombo() {
            container.classList.remove('visible');
            if (timerInterval) clearInterval(timerInterval);
            if (comboTimer) clearTimeout(comboTimer);
        }

        let ws = null;
        let heartbeatTimer = null;
        let reconnectTimer = null;

        function connectWS() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws?topic=widgets&token=${encodeURIComponent(token || '')}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = function () {
                console.log("[Emote Combo Overlay] WebSocket conectado.");
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }
                heartbeatTimer = setInterval(() => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'ping' }));
                    }
                }, 15000);
            };

            ws.onmessage = function (e) {
                try {
                    const data = JSON.parse(e.data);
                    if (data.type === 'pong') return;

                    if (data.event === 'emote_combo') {
                        showCombo(data, data.count, data.timeout_sec || 5.0);
                    } else if (data.event === 'widget_toggle' && data.widget_id === 'combo' && !data.is_active) {
                        hideCombo();
                    }
                } catch (err) {
                    console.error("Error parsing emote combo event:", err);
                }
            };

            ws.onerror = function () {
                cleanup();
                scheduleReconnect();
            };

            ws.onclose = function () {
                cleanup();
                scheduleReconnect();
            };
        }

        function cleanup() {
            if (heartbeatTimer) {
                clearInterval(heartbeatTimer);
                heartbeatTimer = null;
            }
        }

        function scheduleReconnect() {
            if (!reconnectTimer) {
                reconnectTimer = setTimeout(() => {
                    connectWS();
                }, 3000);
            }
        }

        connectWS();
    </script>
</body>

</html>
