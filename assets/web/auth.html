<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <link id="app-favicon" rel="icon" type="image/svg+xml" />
  <title>Autenticación - MiniKick</title>
  <style>
    :root {
      color-scheme: dark;
      --canvas: #0b0e0d;
      --surface: #111614;
      --surface-inset: #0d110f;
      --line: rgba(255, 255, 255, 0.08);
      --line-strong: rgba(255, 255, 255, 0.12);
      --text: #edf3ef;
      --muted: #a2ada6;
      --subtle: #76827a;
      --brand: #15d08b;
      --brand-wash: rgba(21, 208, 139, 0.1);
      --danger: #f07878;
      --danger-wash: rgba(240, 120, 120, 0.1);
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      display: grid;
      place-items: center;
      min-width: 280px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 24px;
      position: relative;
      isolation: isolate;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 50% 48%, rgba(23, 34, 29, 0.72), transparent 58%),
        #101211;
      color: var(--text);
    }

    body::before {
      position: fixed;
      z-index: -1;
      background-image: radial-gradient(rgba(220, 255, 238, 0.1) 0.7px, transparent 0.7px);
      background-size: 34px 34px;
      content: "";
      inset: 0;
      mask-image: linear-gradient(to bottom, transparent, #000 22%, #000 78%, transparent);
      opacity: 0.2;
      pointer-events: none;
    }

    button {
      font: inherit;
    }

    .ambient-light {
      position: fixed;
      z-index: -1;
      width: min(62vw, 760px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(21, 208, 139, 0.17), rgba(21, 208, 139, 0.06) 34%, transparent 70%);
      opacity: 0.62;
      pointer-events: none;
      will-change: transform;
    }

    .ambient-light-one {
      top: -38%;
      left: -20%;
      animation: drift-one 24s ease-in-out infinite alternate;
    }

    .ambient-light-two {
      right: -26%;
      bottom: -54%;
      width: min(72vw, 900px);
      opacity: 0.42;
      animation: drift-two 30s ease-in-out infinite alternate;
    }

    @keyframes drift-one {
      from { transform: translate3d(0, 0, 0) scale(0.94); }
      to { transform: translate3d(18vw, 12vh, 0) scale(1.08); }
    }

    @keyframes drift-two {
      from { transform: translate3d(0, 0, 0) scale(1.06); }
      to { transform: translate3d(-15vw, -12vh, 0) scale(0.94); }
    }

    .auth-result {
      position: relative;
      z-index: 1;
      display: flex;
      width: min(100%, 560px);
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
      text-align: center;
    }

    .brand-mark {
      width: 128px;
      height: 128px;
      margin-bottom: 28px;
      border-radius: 28px;
      animation: mark-arrive 1.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
      filter: drop-shadow(0 0 0 rgba(21, 208, 139, 0));
    }

    @keyframes mark-arrive {
      0% {
        opacity: 0;
        transform: translateY(12px) scale(0.95);
        filter: drop-shadow(0 0 0 rgba(21, 208, 139, 0));
      }
      62% {
        opacity: 1;
        transform: translateY(-2px) scale(1.015);
        filter: drop-shadow(0 8px 24px rgba(21, 208, 139, 0.24));
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: drop-shadow(0 8px 22px rgba(21, 208, 139, 0.16));
      }
    }

    .status-pill {
      display: inline-flex;
      min-height: 30px;
      align-items: center;
      gap: 8px;
      margin: 0 0 18px;
      padding: 0 12px;
      border: 1px solid rgba(21, 208, 139, 0.2);
      border-radius: 999px;
      background: rgba(21, 208, 139, 0.07);
      color: #73e6b5;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.035em;
    }

    .status-pill::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 12px currentColor;
      content: "";
    }

    .result-heading {
      max-width: 520px;
      margin: 0;
      color: #f2f5f3;
      font-size: clamp(27px, 6vw, 34px);
      font-weight: 450;
      letter-spacing: -0.045em;
      line-height: 1.2;
      text-wrap: balance;
    }

    .description {
      max-width: 440px;
      margin: 14px 0 0;
      color: #b5bcb8;
      font-size: 16px;
      font-weight: 350;
      line-height: 1.65;
      text-wrap: pretty;
    }

    .description strong {
      color: #e5ebe7;
      font-weight: 550;
    }

    .result-detail {
      margin: 10px 0 0;
      color: #858e89;
      font-size: 13px;
      line-height: 1.6;
    }

    .error-detail {
      width: min(100%, 420px);
      margin-top: 22px;
      padding: 12px 14px;
      border: 1px solid rgba(240, 120, 120, 0.2);
      border-radius: 8px;
      background: rgba(240, 120, 120, 0.07);
      color: #f0a0a0;
      font-size: 13px;
      line-height: 1.55;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .error-detail[hidden],
    .close-fallback[hidden] {
      display: none;
    }

    .auth-result[data-status="error"] .status-pill {
      border-color: rgba(240, 120, 120, 0.2);
      background: rgba(240, 120, 120, 0.07);
      color: #f19a9a;
    }

    .auth-result[data-status="error"] .brand-mark {
      filter: drop-shadow(0 8px 22px rgba(240, 120, 120, 0.12));
    }

    .close-button {
      width: auto;
      min-width: 144px;
      min-height: 44px;
      margin-top: 30px;
      padding: 0 18px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      color: #e7ece9;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 140ms ease-out, border-color 140ms ease-out, transform 140ms ease-out;
    }

    .close-button:hover {
      border-color: rgba(21, 208, 139, 0.4);
      background: rgba(21, 208, 139, 0.1);
    }

    .close-button:active {
      transform: scale(0.98);
    }

    .close-button:focus-visible {
      outline: 2px solid #73e6b5;
      outline-offset: 3px;
    }

    .auth-result[data-status="error"] .close-button:hover {
      border-color: rgba(240, 120, 120, 0.4);
      background: rgba(240, 120, 120, 0.1);
    }

    .close-fallback {
      margin: 14px 0 0;
      color: #858e89;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .auth-result {
        padding: 24px 12px;
      }

      .brand-mark {
        width: 104px;
        height: 104px;
        margin-bottom: 24px;
        border-radius: 24px;
      }

      .description {
        font-size: 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        will-change: auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="ambient-light ambient-light-one" aria-hidden="true"></div>
  <div class="ambient-light ambient-light-two" aria-hidden="true"></div>
  <main class="auth-result" id="auth-result" data-provider="{{PROVIDER}}" data-status="{{STATUS}}"
    data-error="{{ERROR_MSG}}" aria-labelledby="title-text">
    <img id="app-logo" class="brand-mark" alt="MiniKick" />
    <p class="status-pill" id="status-pill" role="status"></p>
    <h1 class="result-heading" id="title-text"></h1>
    <p class="description">
      <span id="description-primary"></span><strong id="description-provider"></strong><span
        id="description-secondary"></span>
    </p>
    <p class="result-detail" id="result-detail"></p>
    <div class="error-detail" id="error-detail" role="alert" hidden></div>
    <button class="close-button" id="close-button" type="button">Cerrar ventana</button>
    <p class="close-fallback" id="close-fallback" hidden>Puedes cerrar esta pestaña manualmente.</p>
  </main>

    const result = document.getElementById("auth-result");
    const provider = result.dataset.provider === "twitch" ? "Twitch" : "Kick";
    const status = result.dataset.status;
    const errorMessage = result.dataset.error;
    const isSuccess = status === "success";

    document.getElementById("app-logo").src = appIcon;
    document.getElementById("app-favicon").href = appIcon;
    document.title = `${isSuccess ? "Conexión establecida" : "Conexión fallida"} - ${provider} - MiniKick`;

    const statusPill = document.getElementById("status-pill");
    const title = document.getElementById("title-text");
    const primaryDescription = document.getElementById("description-primary");
    const secondaryDescription = document.getElementById("description-secondary");
    const detail = document.getElementById("result-detail");
    const errorDetail = document.getElementById("error-detail");

    if (isSuccess) {
      title.textContent = "Conexión establecida";
      statusPill.textContent = `Cuenta de ${provider} vinculada`;
      primaryDescription.textContent = "Tu cuenta de ";
      document.getElementById("description-provider").textContent = provider;
      secondaryDescription.textContent = " ahora está conectada con MiniKick.";
      detail.textContent = "Ya puedes cerrar esta ventana y volver a la aplicación.";
    } else {
      title.textContent = "No se pudo completar la vinculación";
      statusPill.textContent = "Error de conexión";
      primaryDescription.textContent = "No se pudo conectar tu cuenta de ";
      document.getElementById("description-provider").textContent = provider;
      secondaryDescription.textContent = " con MiniKick.";
      detail.textContent = "Revisa el mensaje de error e inténtalo de nuevo.";
      errorDetail.textContent =
        errorMessage || "La autenticación fue cancelada o expiró.";
      errorDetail.hidden = false;
    }

    document.getElementById("close-button").addEventListener("click", () => {
      window.close();
      window.setTimeout(() => {
        document.getElementById("close-fallback").hidden = false;
      }, 150);
    });
  </script>
</body>
</html>
