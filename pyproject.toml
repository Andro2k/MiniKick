[project]
name = "MiniKick"
version = "1.5.3"
description = "El centro de control definitivo, modular y ligero para streamers en Kick.com"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "websocket-client",
    "python-dotenv",
    "cloudscraper",
    "pyttsx3",
    "PySide6",
    "pyinstaller",
    "edge-tts",
    "asyncio",
    "yt-dlp",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-v -s"

