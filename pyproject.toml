[project]
name = "MiniKick"
version = "1.6.7"
description = "El centro de control definitivo, modular y ligero para streamers en Kick.com"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests",
    "websocket-client",
    "python-dotenv",
    "cloudscraper",
    "pyttsx3",
    "PySide6",
    "pyinstaller",
    "edge-tts>=7.3.1",
    "yt-dlp",
    "piper-tts",
    "pytchat>=0.5.5",
    "msgspec>=0.21.1",
    "orjson>=3.12.0",
    "tiktoklive>=7.0.0",
    "tomli-w>=1.0.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "tomli>=2.5.0",
    "questionary>=2.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["resources/tests"]
addopts = "-v -s -p resources.tests.conftest --timeout=30"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.3.1",
]


[tool.ruff]
target-version = "py314"
extend-exclude = [".agents", ".interface-design"]

[tool.ruff.lint]
select = ["F", "B", "S110", "RUF013", "ASYNC", "PERF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
