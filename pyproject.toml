[project]
name = "MiniKick"
version = "1.5.9"
description = "El centro de control definitivo, modular y ligero para streamers en Kick.com"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "websocket-client",
    "python-dotenv",
    "cloudscraper",
    "pyttsx3",
    "PySide6",
    "pyinstaller",
    "edge-tts",
    "asyncio",
    "yt-dlp",
    "piper-tts",
    "pytchat>=0.5.5",
    "msgspec>=0.21.1",
    "orjson>=3.12.0",
    "tiktoklive>=7.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["resources/tests/backend", "resources/tests/frontend"]
addopts = "-v -s -p resources.tests.conftest --timeout=30"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.3.1",
]

